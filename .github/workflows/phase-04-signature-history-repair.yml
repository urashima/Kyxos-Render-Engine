name: Phase 4 signature History repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-signature-history-repair.yml

permissions:
  contents: write

concurrency:
  group: phase-04-signature-history-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: phase-04-signature-history-stability
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply canonical signature-mismatch roles and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(content.replace(old, new, 1))

          replace_once(
              'packages/renderer/src/dynamic-taa-gpu-history.ts',
              """    const historyValid = this.#history.isReusable(candidate);\n    this.#frameSignature = candidate;\n""",
              """    const historyValid = this.#history.isReusable(candidate);\n    if (!historyValid) this.#readIndex = 0;\n    this.#frameSignature = candidate;\n""",
          )
          replace_once(
              'packages/renderer/src/static-accumulation-gpu-history.ts',
              """    const historyValid = this.#history.isReusable(candidate);\n    this.#frameSignature = candidate;\n""",
              """    const historyValid = this.#history.isReusable(candidate);\n    if (!historyValid) this.#readIndex = 0;\n    this.#frameSignature = candidate;\n""",
          )
          replace_once(
              'packages/renderer/test/dynamic-taa-gpu-history.test.ts',
              """    history.cancelFrame();\n\n    history.invalidate('post-process');\n    const reset = history.prepareFrame(signature({ postProcess: 2 }));\n    expect(reset.historyValid).toBe(false);\n    expect(reset.readColorTexture).toBe(first.readColorTexture);\n    expect(reset.readDepthTexture).toBe(first.readDepthTexture);\n    expect(reset.readNormalTexture).toBe(first.readNormalTexture);\n    expect(reset.writeColorTexture).toBe(first.writeColorTexture);\n    expect(reset.writeDepthTexture).toBe(first.writeDepthTexture);\n    expect(reset.writeNormalTexture).toBe(first.writeNormalTexture);\n    history.cancelFrame();\n\n    const changed = history.prepareFrame(signature({ materials: 2 }));\n    expect(changed.historyValid).toBe(false);\n    expect(history.commitFrame()).toMatchObject({\n      history: {\n        generation: 1,\n        lastInvalidation: 'post-process',\n        sampleCount: 1,\n        valid: true,\n      },\n    });\n""",
              """    history.cancelFrame();\n\n    const changed = history.prepareFrame(signature({ materials: 2 }));\n    expect(changed.historyValid).toBe(false);\n    expect(changed.readColorTexture).toBe(first.readColorTexture);\n    expect(changed.readDepthTexture).toBe(first.readDepthTexture);\n    expect(changed.readNormalTexture).toBe(first.readNormalTexture);\n    expect(changed.writeColorTexture).toBe(first.writeColorTexture);\n    expect(changed.writeDepthTexture).toBe(first.writeDepthTexture);\n    expect(changed.writeNormalTexture).toBe(first.writeNormalTexture);\n    expect(history.commitFrame()).toMatchObject({\n      history: {\n        generation: 1,\n        lastInvalidation: 'signature-mismatch',\n        sampleCount: 1,\n        valid: true,\n      },\n    });\n\n    history.invalidate('post-process');\n    const reset = history.prepareFrame(signature({ materials: 2, postProcess: 2 }));\n    expect(reset.historyValid).toBe(false);\n    expect(reset.readColorTexture).toBe(first.readColorTexture);\n    expect(reset.readDepthTexture).toBe(first.readDepthTexture);\n    expect(reset.readNormalTexture).toBe(first.readNormalTexture);\n    expect(reset.writeColorTexture).toBe(first.writeColorTexture);\n    expect(reset.writeDepthTexture).toBe(first.writeDepthTexture);\n    expect(reset.writeNormalTexture).toBe(first.writeNormalTexture);\n    history.cancelFrame();\n""",
          )
          replace_once(
              'packages/renderer/test/static-accumulation-gpu-history.test.ts',
              """    const changed = history.prepareFrame(signature({ materials: 2 }));\n    expect(changed).toMatchObject({ historyValid: false, previousSampleCount: 0 });\n    expect(history.commitFrame()).toMatchObject({\n""",
              """    const changed = history.prepareFrame(signature({ materials: 2 }));\n    expect(changed).toMatchObject({ historyValid: false, previousSampleCount: 0 });\n    expect(changed.readColorTexture).toBe(first.readColorTexture);\n    expect(changed.writeColorTexture).toBe(first.writeColorTexture);\n    expect(history.commitFrame()).toMatchObject({\n""",
          )
          PY

      - name: Format repair scope
        run: |
          pnpm exec prettier \
            .github/workflows/phase-04-signature-history-repair.yml \
            packages/renderer/src/dynamic-taa-gpu-history.ts \
            packages/renderer/src/static-accumulation-gpu-history.ts \
            packages/renderer/test/dynamic-taa-gpu-history.test.ts \
            packages/renderer/test/static-accumulation-gpu-history.test.ts \
            --write

      - name: Build workspace packages for focused tests
        run: pnpm build:packages

      - name: Run focused History and pipeline regressions
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec vitest run \
            packages/renderer/test/dynamic-taa-gpu-history.test.ts \
            packages/renderer/test/static-accumulation-gpu-history.test.ts \
            packages/renderer/test/temporal-pipeline-transaction.test.ts \
            2>&1 | tee /tmp/focused-history-tests.log

      - name: Upload focused regression output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-focused-history-tests
          path: /tmp/focused-history-tests.log
          if-no-files-found: error

      - name: Require focused regressions
        if: steps.focused.outcome != 'success'
        run: exit 1

      - name: Run complete verification
        id: complete
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee /tmp/complete-verification.log

      - name: Upload complete verification output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-complete-verification
          path: /tmp/complete-verification.log
          if-no-files-found: error

      - name: Require complete verification
        if: steps.complete.outcome != 'success'
        run: exit 1

      - name: Commit verified repair and remove temporary workflow
        run: |
          rm .github/workflows/phase-04-signature-history-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase-04): canonicalize signature-mismatch History roles"
          git push origin HEAD:phase-04-signature-history-stability
