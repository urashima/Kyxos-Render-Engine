name: Phase 4 final core integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: phase-04-final-core
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'phase-04-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-04-final
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Apply core integration
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          LOG=test-results/phase-04/runtime/phase-04-final-patch.log
          : > "$LOG"
          for script in \
            01-settings-camera-layout.mjs \
            02-history-pbr-output.mjs \
            03-pbr-feature.mjs \
            04-resolve-pass.mjs \
            05-temporal-integration.mjs \
            06-exports.mjs
          do
            echo "=== $script ===" | tee -a "$LOG"
            node ".github/scripts/phase-04-final/$script" 2>&1 | tee -a "$LOG"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format transformed sources
        run: pnpm format

      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build:packages 2>&1 | tee test-results/phase-04/runtime/phase-04-final-package-build.log

      - name: Validate shaders
        shell: bash
        run: |
          set -o pipefail
          pnpm validate:shaders 2>&1 | tee test-results/phase-04/runtime/phase-04-final-shader-validation.log

      - name: Remove one-shot integration files
        run: |
          rm -rf .github/scripts/phase-04-final
          rm -f .github/workflows/phase-04-core-integrate.yml

      - name: Commit core checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(phase-04): integrate TRAA velocity core"
          git push origin HEAD:phase-04-final

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-final-core-${{ github.run_attempt }}
          path: |
            test-results/phase-04/runtime/
            packages/renderer/src/
            packages/camera/src/temporal-camera.ts
            packages/sdk/src/temporal-pbr.ts
            shaders/webgpu/phase-04-*.wgsl
          if-no-files-found: ignore
          retention-days: 7
