name: Apply Phase 4 Dynamic TAA tuning panel V3

on:
  push:
    branches:
      - agent/phase-04-taa-tuning-panel
  pull_request:
    branches:
      - main

concurrency:
  group: phase-04-taa-tuning-apply-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-verify:
    name: Apply tuning implementation and run complete verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'

    steps:
      - name: Check out tuning branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-taa-tuning-panel
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact atomic payload
        shell: bash
        run: |
          test "$(sha256sum .github/taa-patch/part-00.txt | cut -d' ' -f1)" = 52741923aff09d03a5df1507580c146473d9d1e487f5ae02451c24e04f9c785c
          test "$(sha256sum .github/taa-patch/part-01.txt | cut -d' ' -f1)" = 6636476c1892952a204c98443ecc2bca9710cb7dc800c1d36ee31b90343bdd07
          test "$(sha256sum .github/taa-patch/part-02.txt | cut -d' ' -f1)" = fa16c20ac7765c60f7268f88bf8ae53c32a6d19263dc1a26e5868ce6fc895dc8
          test "$(sha256sum .github/taa-patch/part-03.txt | cut -d' ' -f1)" = 134679c7d82b2da67d655fa6481326397f3afa9aecb085681a8d09074f786159
          test "$(sha256sum .github/taa-patch/part-04.txt | cut -d' ' -f1)" = 086385051c71f3d17b09ac9270ee87567adbb7f8f7dca10bb0e34a7774bf6972
          cat .github/taa-patch/part-*.txt | tr -d '\r\n' > /tmp/phase-04-taa-tuning.b64
          test "$(sha256sum /tmp/phase-04-taa-tuning.b64 | cut -d' ' -f1)" = 674bb1aed35ffb87e073ab7a495160ec7b2c8b5573f44fb17b5ae3c4818d7adc
          base64 --decode /tmp/phase-04-taa-tuning.b64 > /tmp/phase-04-taa-tuning.tar.gz
          tar -xzf /tmp/phase-04-taa-tuning.tar.gz
          test -f packages/renderer/src/temporal-taa-settings.ts
          test -f apps/playground/src/acceptance/phase-04/index.ts

      - name: Remove temporary transport files
        shell: bash
        run: |
          rm -rf .github/taa-patch
          rm -f .github/workflows/export-phase-04-taa-source.yml
          rm -f .github/workflows/apply-phase-04-taa-tuning.yml
          rm -f .github/workflows/apply-phase-04-taa-tuning-v2.yml
          rm -f .github/workflows/apply-phase-04-taa-tuning-v3.yml

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Format exact checkpoint
        run: |
          pnpm exec prettier --write \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md \
            packages/renderer/src/index.ts \
            packages/renderer/src/dynamic-taa-resolve-pass.ts \
            packages/renderer/src/temporal-pipeline-transaction.ts \
            packages/renderer/src/temporal-pbr-render-feature.ts \
            packages/renderer/src/temporal-taa-settings.ts \
            packages/renderer/test/dynamic-taa-resolve-pass.test.ts \
            packages/renderer/test/temporal-pbr-render-feature.test.ts \
            packages/renderer/test/temporal-taa-settings.test.ts \
            packages/sdk/src/create-temporal-pbr-renderer.ts \
            packages/sdk/src/temporal-pbr-canvas-renderer.ts \
            packages/sdk/src/temporal-pbr.ts \
            packages/sdk/src/index.ts \
            packages/sdk/test/temporal-pbr-consumer.test.ts \
            apps/playground/src/acceptance/phase-04/index.ts \
            apps/playground/src/acceptance/phase-04/phase-04.css \
            tests/e2e/phase-04-acceptance.spec.ts \
            tests/e2e/online-pages.spec.ts

      - name: Run complete verification pipeline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04
          pnpm verify 2>&1 | tee test-results/phase-04/taa-tuning-verify.log

      - name: Commit verified atomic implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(phase-04): expose complete Dynamic TAA tuning panel'
          git push origin HEAD:agent/phase-04-taa-tuning-panel

      - name: Upload verification diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-taa-tuning-v3-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
