name: Phase 4 public failure diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-public-failure-diagnostic.yml

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: e9ba237744dc33253a40dd05dc47ded15fb586d9
    steps:
      - name: Capture exact workflow and public failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" > /tmp/runs.json
          jq -r '.workflow_runs[] | [.id,.name,.event,.status,.conclusion,.head_sha] | @tsv' /tmp/runs.json
          pages_run="$(jq -r '[.workflow_runs[] | select(.name == "Deploy accepted Playgrounds" and .event == "workflow_run")] | sort_by(.created_at) | reverse | .[0].id // empty' /tmp/runs.json)"
          test -n "$pages_run"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${pages_run}/jobs?per_page=100" > /tmp/pages-jobs.json
          public_job="$(jq -r '[.jobs[] | select(.name == "Verify public interactions")][0].id // empty' /tmp/pages-jobs.json)"
          test -n "$public_job"
          gh run view "$pages_run" --repo "${GITHUB_REPOSITORY}" --log-failed > /tmp/public-failure.log
          gh api "/repos/${GITHUB_REPOSITORY}/deployments?sha=${TARGET_SHA}&environment=github-pages&per_page=20" > /tmp/deployments.json
          tail -n 260 /tmp/public-failure.log

      - name: Upload exact public failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-public-failure-diagnostic
          path: |
            /tmp/runs.json
            /tmp/pages-jobs.json
            /tmp/deployments.json
            /tmp/public-failure.log
          if-no-files-found: ignore
