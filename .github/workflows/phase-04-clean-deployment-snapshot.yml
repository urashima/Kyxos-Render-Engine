name: Phase 4 clean deployment snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-clean-deployment-snapshot.yml

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: 5faf7a8bcf643954dc42e3442f33690efd608a66
    steps:
      - name: Capture workflow and deployment state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" > /tmp/runs.json
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/deployments?sha=${TARGET_SHA}&per_page=100" > /tmp/deployments.json
          jq '{total_count, workflow_runs: [.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at}]}' /tmp/runs.json > /tmp/summary.json
          cat /tmp/summary.json

      - name: Upload deployment snapshot
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-clean-deployment-snapshot
          path: |
            /tmp/summary.json
            /tmp/deployments.json
