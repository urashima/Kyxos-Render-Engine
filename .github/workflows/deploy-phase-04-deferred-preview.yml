name: Phase 4 Preview Staging

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/deploy-phase-04-deferred-preview.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write

jobs:
  stage:
    name: Validate exact Deferred TRAA preview source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR Head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packages and preview build
        env:
          PLAYGROUND_BASE_PATH: /Kyxos-Render-Engine/preview/phase-04-deferred-traa-resolve/app/
          VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VITE_DEPLOYED_PHASE: '4'
          VITE_LATEST_ACCEPTED_PHASE: '4'
        run: |
          pnpm build:packages
          pnpm --filter @kyxos/render-playground build
          test -f apps/playground/dist/index.html
          grep -F '/Kyxos-Render-Engine/preview/phase-04-deferred-traa-resolve/app/assets/' apps/playground/dist/index.html

      - name: Cancel stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: '7596a09b47ceb41a67a1073387b43b5014115603',
                headers: { 'X-GitHub-Api-Version': '2026-03-10' },
              });
              core.info('Cancelled stale Pages deployment 7596a09.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Stale Pages deployment was already absent.');
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));

      - name: Dispatch trusted Main Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
