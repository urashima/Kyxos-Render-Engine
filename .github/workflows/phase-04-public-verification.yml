name: Phase 4 public deployment verification

on:
  push:
    branches:
      - agent/phase-04-public-verification
  pull_request:
    branches:
      - main

concurrency:
  group: phase-04-public-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-public:
    name: Verify deployed Phase 4 and Latest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPECTED_COMMIT_SHA: 43d510a12341cafd6cb1aeb917252d93f222b33f
      PAGES_LATEST_PHASE: '4'
      PAGES_PHASES: 0,1,2,3,4
      PUBLIC_PLAYGROUND_URL: https://urashima.github.io/Kyxos-Render-Engine/

    steps:
      - name: Check out verification source
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-public-verification
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for public routes
        shell: bash
        run: |
          base_url="${PUBLIC_PLAYGROUND_URL%/}/"
          curl --fail --silent --show-error --location \
            --retry 24 --retry-all-errors --retry-delay 5 \
            "${base_url}latest/" >/dev/null
          curl --fail --silent --show-error --location \
            --retry 24 --retry-all-errors --retry-delay 5 \
            "${base_url}phase-4/" >/dev/null

      - name: Run exact public Chromium and WebGPU operation gate
        run: pnpm exec playwright test --config playwright.pages.config.ts

      - name: Write public verification evidence
        if: ${{ success() }}
        shell: bash
        run: |
          mkdir -p test-results/phase-04/public
          cat > test-results/phase-04/public/verification.json <<EOF
          {
            "schemaVersion": 1,
            "phase": "04",
            "status": "PASS",
            "expectedCommit": "${EXPECTED_COMMIT_SHA}",
            "latestPhase": 4,
            "phases": [0, 1, 2, 3, 4],
            "publicUrl": "${PUBLIC_PLAYGROUND_URL}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowJob": "Verify deployed Phase 4 and Latest"
          }
          EOF

      - name: Upload public verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-public-verification-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/phase-04/public/
            test-results/pages/
          if-no-files-found: ignore
          retention-days: 7
