name: Finalize Phase 4 public gate hardening

on:
  push:
    branches:
      - agent/phase-04-public-verification
    paths:
      - .github/workflows/phase-04-public-verification.yml

concurrency:
  group: phase-04-public-verification-finalize
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    name: Reverify public deployment and synchronize canonical state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPECTED_COMMIT_SHA: 43d510a12341cafd6cb1aeb917252d93f222b33f
      PAGES_LATEST_PHASE: '4'
      PAGES_PHASES: 0,1,2,3,4
      PUBLIC_PLAYGROUND_URL: https://urashima.github.io/Kyxos-Render-Engine/

    steps:
      - name: Check out verification branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-public-verification
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for public routes
        shell: bash
        run: |
          base_url="${PUBLIC_PLAYGROUND_URL%/}/"
          curl --fail --silent --show-error --location \
            --retry 24 --retry-all-errors --retry-delay 5 \
            "${base_url}latest/" >/dev/null
          curl --fail --silent --show-error --location \
            --retry 24 --retry-all-errors --retry-delay 5 \
            "${base_url}phase-4/" >/dev/null

      - name: Re-run exact public Chromium and WebGPU operation gate
        run: pnpm exec playwright test --config playwright.pages.config.ts

      - name: Synchronize canonical Phase 4 state
        shell: python
        run: |
          from pathlib import Path

          status_path = Path('WORK_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          replacements = {
              '- **Current Branch:** `agent/phase-04-temporal` / Draft PR #7':
                  '- **Current Branch:** `agent/phase-04-public-verification` / PR #10',
              '- **Overall Progress:** 4 / 15 phases accepted; P4-01 through P4-11 completed; P4-12 implementation and deterministic pre-deployment evidence verified':
                  '- **Overall Progress:** 4 / 15 phases accepted; P4-01 through P4-11 completed; P4-12 implementation merged and exact public deployment verified; online gate hardening pending merge',
              '- **Next Action:** Require the exact final-provenance Head to pass the complete `pnpm verify` gate, then mark PR #7 ready and merge with expected-Head protection':
                  '- **Next Action:** Require the exact PR #10 final Head to pass complete `pnpm verify`, then merge with expected-Head protection and require main Pages redeployment/public verification',
              '- **CI Status:** Deterministic baseline Head passed complete `pnpm verify`; final provenance-only Head must remain green before merge':
                  '- **CI Status:** PR #10 logic Head passed complete `pnpm verify` and the exact public Pages gate; final documentation/cleanup Head pending',
              '- **Acceptance Status:** Phase 0–3 Accepted; Phase 4 Owner Acceptance Passed — Deployment Pending; final provenance CI, merge, public verification, and accepted tag pending':
                  '- **Acceptance Status:** Phase 0–3 Accepted; Phase 4 Owner Acceptance Passed — Deployment Pending; online gate hardening merge, redeploy, public re-verification, and accepted tag pending',
              '- **Last Updated:** 2026-07-23 03:56 PDT':
                  '- **Last Updated:** 2026-07-23 04:50 PDT',
              '|    04 | Deployment Pending | `agent/phase-04-temporal`            | #7  | IN PROGRESS | Owner PASS     | —                   |':
                  '|    04 | Deployment Pending | `agent/phase-04-public-verification` | #10 | IN PROGRESS | Owner PASS     | —                   |',
          }
          for before, after in replacements.items():
              if before not in status:
                  raise SystemExit(f'WORK_STATUS replacement source missing: {before}')
              status = status.replace(before, after, 1)
          status_path.write_text(status, encoding='utf-8')

          tasks_path = Path('docs/execution/PHASE_04_TASKS.md')
          tasks = tasks_path.read_text(encoding='utf-8')
          replacements = {
              'Branch: `agent/phase-04-temporal`':
                  'Branch: `agent/phase-04-public-verification`',
              'Pull request: `#7`':
                  'Pull request: `#10`',
              'SDK-only route, public operations, deterministic post-animation reset, reviewed zero-diff visual, fail-closed evidence/checker and CI':
                  'SDK-only route, deterministic post-animation reset, reviewed zero-diff visual, lazy-resource lifecycle, fail-closed local/public gates',
          }
          for before, after in replacements.items():
              if before not in tasks:
                  raise SystemExit(f'PHASE_04_TASKS replacement source missing: {before}')
              tasks = tasks.replace(before, after, 1)
          old_gate = '\n'.join([
              '- the deterministic visual-baseline Head passed the complete pinned CI gate without source drift;',
              '- final CI provenance is recorded in the canonical task/status/log documents;',
              '- the final provenance-only Head passes the complete pinned CI gate without source drift;',
              '- PR #7 is marked ready and merged with expected-Head protection;',
              '- GitHub Pages deploys the verified merge source;',
              '- public `/phase-4/` and `/latest/` pass the required Chromium/WebGPU operation sequence;',
              '- immutable `phase-04-accepted` targets the deployed accepted source.',
          ])
          new_gate = '\n'.join([
              '- the deterministic visual and final implementation Heads passed the complete pinned CI gate;',
              '- PR #7 merged with expected-Head protection as `43d510a12341cafd6cb1aeb917252d93f222b33f`;',
              '- GitHub Pages deployed that exact merge source and independent Run `30004176537` passed Phase 0–4 plus Latest Chromium/WebGPU operations;',
              '- PR #10 merges the corrected online contract for Phase 4 Temporal HUD and lazy/recovered resource watermarks;',
              '- the PR #10 merge source passes main CI, Pages redeployment, and the built-in public operation gate;',
              '- immutable `phase-04-accepted` targets the deployed accepted source.',
          ])
          if old_gate not in tasks:
              raise SystemExit('Phase 4 deployment gate source block was not found.')
          tasks_path.write_text(tasks.replace(old_gate, new_gate, 1), encoding='utf-8')

          log_path = Path('docs/execution/WORK_LOG.md')
          log = log_path.read_text(encoding='utf-8')
          marker = '## 2026-07-23 04:50 PDT — P4-12 exact public deployment verified and gate contract hardened'
          entry_lines = [
              '',
              '',
              marker,
              '',
              '### Completed',
              '',
              '- Merged PR #7 from exact verified Head `881c0ef631c37d68f0caddd7245d3439b9f46e92`;',
              '  implementation merge source is `43d510a12341cafd6cb1aeb917252d93f222b33f`.',
              '- Confirmed public `/phase-4/` and `/latest/` both expose that exact merge source and operate',
              '  through WebGPU with 16/16 samples, valid History, sleep/wake, animation, Device Lost recovery,',
              '  Dispose, and Recreate.',
              '- Hardened the repository-owned online gate so Phase 4 uses its Temporal diagnostics contract',
              '  instead of the legacy Phase 1–3 `shader-status` field.',
              '- Hardened resource checks around the actual lazy lifecycle: cold baseline 73, bounded warm',
              '  watermark up to 75, Device Lost to 0, recovery/recreation to the stable cold window, and Dispose to 0.',
              '',
              '### Validation',
              '',
              '- Final PR #7 Head passed Run `30001568782`, job `89187770623`: complete `pnpm verify` PASS.',
              '- Independent exact-deployment investigation remained fail-closed:',
              '  - Run `30002606828`, Artifact `8561682235` isolated the obsolete Phase 4 `shader-status` assertion;',
              '  - Run `30003010379`, Artifact `8561858242` isolated first Texture warm-up from 73 to 75 resources;',
              '  - Run `30003387960`, Artifact `8561999265` showed first Orbit may perform that same bounded warm-up;',
              '  - Run `30003773254`, Artifact `8562168398` showed Device Lost recovery correctly rebuilds the cold 73-resource baseline.',
              '- Corrected logic Head `8adca92afb00fa4dacda0743a39719dbba169e47` passed full Run',
              '  `30004176576`, job `89196144033`; Artifact `8562370467`, digest',
              '  `sha256:bf389fdb68aee5d7ad07da532db1fd5090de338b0ce422860a7eef18a1a68ed7`.',
              '- The same Head passed public Run `30004176537`, job `89196143362`; Artifact `8562346500`,',
              '  digest `sha256:c0bdaca37ba5215b4bbc36a406ff4f5b119264359c9c0d062a6dba770cc71013`.',
              '- Public verification covered Phase 0–4 and Latest against expected commit',
              '  `43d510a12341cafd6cb1aeb917252d93f222b33f`; no application or GPU runtime errors remained.',
              '',
              '### Next',
              '',
              '- Require the exact PR #10 final documentation/cleanup Head to pass complete `pnpm verify`.',
              '- Merge with expected-Head protection, then require main CI, Pages redeployment, built-in public',
              '  verification, and immutable `phase-04-accepted` before marking P4-12 Completed.',
          ]
          if marker not in log:
              log_path.write_text(log.rstrip() + '\n'.join(entry_lines) + '\n', encoding='utf-8')

      - name: Format canonical documents
        run: |
          pnpm exec prettier --write \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md \
            docs/execution/WORK_LOG.md

      - name: Commit canonical synchronization and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase-04-public-verification.yml
          git add WORK_STATUS.md docs/execution/PHASE_04_TASKS.md docs/execution/WORK_LOG.md
          git commit -m 'docs(phase-04): record exact public deployment verification'
          git push origin HEAD:agent/phase-04-public-verification
