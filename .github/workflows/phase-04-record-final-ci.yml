name: Record Phase 4 final CI provenance

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/phase-04-record-final-ci.yml

concurrency:
  group: phase-04-record-final-ci
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    name: Synchronize canonical Phase 4 provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Record final baseline CI provenance
        shell: python
        run: |
          from pathlib import Path

          status_path = Path('WORK_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          replacements = {
              '- **Next Action:** Require the exact deterministic visual-baseline Head to pass the complete `pnpm verify` gate, then freeze final CI provenance':
                  '- **Next Action:** Require the exact final-provenance Head to pass the complete `pnpm verify` gate, then mark PR #7 ready and merge with expected-Head protection',
              '- **CI Status:** Deterministic repair candidate passed every nonvisual gate and 32 browser/WebGPU cases; baseline-promotion Head pending':
                  '- **CI Status:** Deterministic baseline Head passed complete `pnpm verify`; final provenance-only Head must remain green before merge',
              '- **Acceptance Status:** Phase 0–3 Accepted; Phase 4 Owner Acceptance Passed — Deployment Pending; final CI, merge, public verification, and accepted tag pending':
                  '- **Acceptance Status:** Phase 0–3 Accepted; Phase 4 Owner Acceptance Passed — Deployment Pending; final provenance CI, merge, public verification, and accepted tag pending',
              '- **Last Updated:** 2026-07-23 03:30 PDT':
                  '- **Last Updated:** 2026-07-23 03:56 PDT',
          }
          for before, after in replacements.items():
              if before not in status:
                  raise SystemExit(f'WORK_STATUS replacement source missing: {before}')
              status = status.replace(before, after, 1)
          status_path.write_text(status, encoding='utf-8')

          tasks_path = Path('docs/execution/PHASE_04_TASKS.md')
          tasks = tasks_path.read_text(encoding='utf-8')
          old = '''- the deterministic visual-baseline Head passes the complete pinned CI gate without source drift;
- final CI provenance is recorded in the canonical task/status/log documents;
- PR #7 is marked ready and merged with expected-Head protection;'''
          new = '''- the deterministic visual-baseline Head passed the complete pinned CI gate without source drift;
- final CI provenance is recorded in the canonical task/status/log documents;
- the final provenance-only Head passes the complete pinned CI gate without source drift;
- PR #7 is marked ready and merged with expected-Head protection;'''
          if old not in tasks:
              raise SystemExit('Phase 4 deployment gate source text was not found.')
          tasks_path.write_text(tasks.replace(old, new, 1), encoding='utf-8')

          log_path = Path('docs/execution/WORK_LOG.md')
          log = log_path.read_text(encoding='utf-8')
          marker = '## 2026-07-23 03:56 PDT — P4-12 deterministic baseline Head verified'
          entry = '''

          ## 2026-07-23 03:56 PDT — P4-12 deterministic baseline Head verified

          ### Completed

          - Verified the promoted deterministic Phase 4 visual baseline on the exact non-workflow Head.
          - Confirmed the public acceptance route still exercises Camera, Material, Texture, Animation,
            Resize, Device Lost recovery, Dispose, and Recreate through the public SDK.
          - Preserved `maxDiffPixels: 0`, threshold `0.2`, all budgets, and accepted Phase 0–3 artifacts.

          ### Validation

          - Head `bb69ea17ed2c1156f3ce2bd63c0bd529f2c78177` passed GitHub Actions Run
            `30000020272`, job `89182762580`: complete `pnpm verify` PASS.
          - The gate passed formatting, zero-warning lint, strict typecheck, 62 unit files / 275 tests,
            documentation governance, dependency boundaries and negative fixture, architecture checks,
            Phase 0–4 acceptance schemas, 14 canonical WGSL modules, all builds, bundle budgets, Pages
            build verification, and all 33 pinned Chromium/WebGPU cases.
          - Artifact `8560696284`, digest
            `sha256:e6a6e86a0dd11fc2d8b5b946da8f8179e7d807965047b1dbc38734777d2b9871`,
            preserves the authoritative diagnostics for the deterministic baseline Head.
          - Reference and Current remain the reviewed 1440×1600 image with SHA-256
            `0fd501b1e132aaae53b411d49f00bf18c5e4b71e3cbf7c49a297cf70c2b185ea`;
            the zero-difference gate passed without tolerance changes.

          ### Next

          - Require the final provenance-only Head to pass the complete read-only `pnpm verify` gate.
          - If green, mark PR #7 ready and merge with expected-Head protection, then verify public
            `/phase-4/` and `/latest/` before freezing `phase-04-accepted`.
          '''
          if marker not in log:
              log_path.write_text(log.rstrip() + entry + '\n', encoding='utf-8')

      - name: Format canonical documents
        run: |
          pnpm exec prettier --write \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md \
            docs/execution/WORK_LOG.md

      - name: Commit synchronized provenance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase-04-record-final-ci.yml
          git add WORK_STATUS.md docs/execution/PHASE_04_TASKS.md docs/execution/WORK_LOG.md
          git commit -m 'docs(phase-04): record deterministic baseline CI provenance'
          git push origin HEAD:agent/phase-04-temporal
