name: Format P4-10 checkpoint files

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/agent-format-p4-10.yml

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: 'true'
    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-format-p4-10.yml
          git add packages/temporal packages/renderer tests/e2e playwright.config.ts tools/shader-build
          git commit -m "style(phase-04): format P4-10 checkpoint"
          git push origin HEAD:agent/phase-04-temporal
