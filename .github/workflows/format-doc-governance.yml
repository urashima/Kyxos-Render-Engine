name: One-shot canonical formatter

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/format-doc-governance.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          pnpm exec prettier --write \
            README.md \
            docs/execution/DECISIONS.md \
            docs/execution/PHASE_03_TASKS.md \
            docs/execution/PHASE_04_TASKS.md \
            docs/execution/WORK_LOG.md \
            tools/quality/check-documentation-governance.mjs \
            packages/sdk/src/create-temporal-pbr-renderer.ts \
            packages/sdk/src/temporal-pbr-canvas-renderer.ts \
            apps/playground/src/acceptance/phase-04/index.ts \
            apps/playground/src/acceptance/phase-04/phase-04.css
      - name: Commit formatted sources and remove workflow
        run: |
          git rm .github/workflows/format-doc-governance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/execution tools/quality/check-documentation-governance.mjs packages/sdk/src apps/playground/src
          git commit -m "style: apply canonical repository formatting"
          git push origin HEAD:agent/phase-04-temporal
