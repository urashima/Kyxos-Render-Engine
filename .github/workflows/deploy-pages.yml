name: Deploy accepted Playgrounds

on:
  workflow_run:
    workflows:
      - Phase verification
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build accepted phase history
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      latest: ${{ steps.accepted.outputs.latest }}
      phases: ${{ steps.accepted.outputs.phases }}
    steps:
      - name: Resolve verified main commit
        id: source
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "commit_sha=${VERIFIED_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check out verified main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.commit_sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Resolve accepted phase history
        id: accepted
        run: node tools/deployment/accepted-phases.mjs --github-output

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build packages
        run: pnpm build:packages

      - name: Build isolated phase Playgrounds
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
        run: pnpm build:pages

      - name: Verify Pages artifact
        run: pnpm check:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    name: Deploy public Playground
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Wait for public routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PHASES: ${{ needs.build.outputs.phases }}
        run: |
          base_url="${PAGE_URL%/}/"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${base_url}latest/" >/dev/null
          for phase in ${PHASES//,/ }; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${base_url}phase-${phase}/" >/dev/null
          done

  verify-online:
    name: Verify public interactions
    needs:
      - build
      - deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public Chromium and WebGPU smoke tests
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          PAGES_LATEST_PHASE: ${{ needs.build.outputs.latest }}
          PAGES_PHASES: ${{ needs.build.outputs.phases }}
          PUBLIC_PLAYGROUND_URL: ${{ needs.deploy.outputs.page_url }}
        run: pnpm exec playwright test --config playwright.pages.config.ts
