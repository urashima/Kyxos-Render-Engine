name: Deploy accepted Playgrounds

on:
  issue_comment:
    types:
      - created
  workflow_run:
    workflows:
      - Phase verification
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build accepted phase history and Deferred TRAA preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 34 && github.event.comment.body == '/deploy-phase-04-preview') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      latest: ${{ steps.accepted.outputs.latest }}
      phases: ${{ steps.accepted.outputs.phases }}
      preview_sha: ${{ steps.preview.outputs.preview_sha }}
    steps:
      - name: Resolve verified main commit
        id: source
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "commit_sha=${VERIFIED_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check out verified main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.commit_sha }}
          persist-credentials: false

      - name: Check out Phase 4 Deferred TRAA preview source
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-deferred-traa-rebuild
          path: preview-source
          persist-credentials: false

      - name: Resolve preview source commit
        id: preview
        run: echo "preview_sha=$(git -C preview-source rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install main dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install preview dependencies from lockfile
        working-directory: preview-source
        run: pnpm install --frozen-lockfile

      - name: Resolve accepted phase history
        id: accepted
        run: node tools/deployment/accepted-phases.mjs --github-output

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build main packages
        run: pnpm build:packages

      - name: Build isolated accepted Playgrounds
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
        run: pnpm build:pages

      - name: Verify accepted Pages artifact
        run: pnpm check:pages

      - name: Build Phase 4 Deferred TRAA branch Playground
        working-directory: preview-source
        env:
          PLAYGROUND_BASE_PATH: ${{ steps.pages.outputs.base_path }}/preview/phase-04-deferred-traa-resolve/app/
          VITE_COMMIT_SHA: ${{ steps.preview.outputs.preview_sha }}
          VITE_DEPLOYED_PHASE: '4'
          VITE_LATEST_ACCEPTED_PHASE: '4'
        run: |
          pnpm build:packages
          pnpm --filter @kyxos/render-playground build
          mkdir -p ../pages-dist/preview/phase-04-deferred-traa-resolve/app
          cp -R apps/playground/dist/. ../pages-dist/preview/phase-04-deferred-traa-resolve/app/

      - name: Add explicit Deferred TRAA checkpoint landing
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PREVIEW_SHA: ${{ steps.preview.outputs.preview_sha }}
        run: |
          mkdir -p pages-dist/preview/phase-04-deferred-traa-resolve
          cat > pages-dist/preview/phase-04-deferred-traa-resolve/checkpoint.json <<EOF
          {
            "schemaVersion": 1,
            "phase": 4,
            "checkpoint": "independent-deferred-traa-resolve",
            "commitSha": "${PREVIEW_SHA}",
            "status": "Automated Verification Passed",
            "visibleRoute": "legacy Phase 4 comparison Playground",
            "independentPipeline": "GBuffer, Deferred Lighting, History and TRAA Resolve are implemented; independent Post Process and Present are not connected yet"
          }
          EOF
          cat > pages-dist/preview/phase-04-deferred-traa-resolve/index.html <<EOF
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Kyxos Phase 4 Deferred TRAA Preview</title>
              <style>
                :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
                * { box-sizing: border-box; }
                body { margin: 0; background: #0a0d12; color: #eef3f8; }
                header { padding: 18px 24px; border-bottom: 1px solid #263141; background: #101722; }
                h1 { margin: 0 0 8px; font-size: 20px; }
                p { margin: 4px 0; color: #aebdce; line-height: 1.5; }
                code { color: #86d9ff; overflow-wrap: anywhere; }
                .status { color: #8ee7a8; font-weight: 700; }
                .warning { color: #ffd487; }
                iframe { width: 100%; height: calc(100vh - 174px); border: 0; background: #000; }
                a { color: #86d9ff; }
              </style>
            </head>
            <body>
              <header>
                <h1>Phase 4 · Independent Deferred TRAA Resolve Preview</h1>
                <p class="status">GBuffer → Deferred Lighting → History → TRAA Resolve：完整 CI 已通过</p>
                <p class="warning">当前独立 Resolve 尚未连接新的 Post Process / Present；下方仍是旧 Phase 4 比较 Playground，不能作为新管线最终视觉验收。</p>
                <p>Branch Head：<code>${PREVIEW_SHA}</code> · <a href="./checkpoint.json">Checkpoint JSON</a> · <a href="./app/">单独打开 Playground</a></p>
              </header>
              <iframe title="Kyxos Phase 4 branch Playground" src="${BASE_PATH}/preview/phase-04-deferred-traa-resolve/app/"></iframe>
            </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    name: Deploy public Playground and preview
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Wait for public accepted and preview routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PHASES: ${{ needs.build.outputs.phases }}
          PREVIEW_SHA: ${{ needs.build.outputs.preview_sha }}
        run: |
          base_url="${PAGE_URL%/}/"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${base_url}latest/" >/dev/null
          for phase in ${PHASES//,/ }; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${base_url}phase-${phase}/" >/dev/null
          done
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${base_url}preview/phase-04-deferred-traa-resolve/" >/tmp/preview.html
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${base_url}preview/phase-04-deferred-traa-resolve/app/" >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${base_url}preview/phase-04-deferred-traa-resolve/checkpoint.json" >/tmp/checkpoint.json
          grep -F "${PREVIEW_SHA}" /tmp/preview.html
          grep -F "${PREVIEW_SHA}" /tmp/checkpoint.json

  verify-online:
    name: Verify public interactions
    needs:
      - build
      - deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public Chromium and WebGPU smoke tests
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          PAGES_LATEST_PHASE: ${{ needs.build.outputs.latest }}
          PAGES_PHASES: ${{ needs.build.outputs.phases }}
          PUBLIC_PLAYGROUND_URL: ${{ needs.deploy.outputs.page_url }}
        run: pnpm exec playwright test --config playwright.pages.config.ts

  report-preview:
    name: Report Phase 4 preview deployment
    if: >-
      always() &&
      (github.event_name != 'issue_comment' || github.event.comment.body == '/deploy-phase-04-preview')
    needs:
      - build
      - deploy
      - verify-online
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Report deployment result to PR 34
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PREVIEW_SHA: ${{ needs.build.outputs.preview_sha }}
          VERIFY_RESULT: ${{ needs.verify-online.result }}
        with:
          script: |
            const passed = process.env.BUILD_RESULT === 'success' && process.env.DEPLOY_RESULT === 'success' && process.env.VERIFY_RESULT === 'success';
            const previewUrl = 'https://urashima.github.io/Kyxos-Render-Engine/preview/phase-04-deferred-traa-resolve/';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = passed
              ? `✅ Phase 4 Deferred TRAA checkpoint preview deployed and public verification passed.\n\n- Preview: ${previewUrl}\n- Branch source: \`${process.env.PREVIEW_SHA}\`\n- Workflow: ${runUrl}\n\nThe independent Resolve is implemented and verified, but the preview clearly retains the legacy visual route until independent Post Process / Present integration is complete.`
              : `❌ Phase 4 Deferred TRAA checkpoint preview deployment did not complete.\n\n- Build: ${process.env.BUILD_RESULT}\n- Deploy: ${process.env.DEPLOY_RESULT}\n- Public verification: ${process.env.VERIFY_RESULT}\n- Workflow: ${runUrl}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 34,
              body,
            });
