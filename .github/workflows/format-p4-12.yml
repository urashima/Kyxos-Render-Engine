name: Format P4-12 integration

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/format-p4-12.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            WORK_STATUS.md \
            docs/execution/DECISIONS.md \
            docs/execution/WORK_LOG.md \
            packages/sdk/src/create-temporal-pbr-renderer.ts \
            packages/sdk/src/temporal-pbr-canvas-renderer.ts \
            packages/sdk/src/temporal-pbr.ts \
            packages/sdk/test/temporal-pbr-renderer.test.ts
      - name: Remove formatter and commit
        run: |
          git rm .github/workflows/format-p4-12.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORK_STATUS.md docs/execution/DECISIONS.md docs/execution/WORK_LOG.md packages/sdk/src packages/sdk/test
          git commit -m "style(phase-04): normalize P4-12 integration"
          git push origin HEAD:agent/phase-04-temporal
