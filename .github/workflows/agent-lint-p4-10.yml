name: Normalize P4-10 lint

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/agent-lint-p4-10.yml

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec eslint --fix \
            packages/renderer/src/static-accumulation-gpu-history.ts \
            packages/renderer/test/static-accumulation-pass.test.ts \
            tests/e2e/phase-04-static-accumulation-runtime.spec.ts
          pnpm exec prettier --write \
            packages/renderer/src/static-accumulation-gpu-history.ts \
            packages/renderer/test/static-accumulation-pass.test.ts \
            tests/e2e/phase-04-static-accumulation-runtime.spec.ts
      - name: Commit normalized files
        run: |
          git rm .github/workflows/agent-lint-p4-10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/renderer/src/static-accumulation-gpu-history.ts packages/renderer/test/static-accumulation-pass.test.ts tests/e2e/phase-04-static-accumulation-runtime.spec.ts
          git commit -m 'style(phase-04): normalize static accumulation lint'
          git push origin HEAD:agent/phase-04-temporal
