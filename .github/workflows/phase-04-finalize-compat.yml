name: Phase 4 final compatibility

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

concurrency:
  group: phase-04-final-compatibility
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  superseded:
    if: github.head_ref == 'phase-04-final'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Superseded by Phase 4 final verification"
