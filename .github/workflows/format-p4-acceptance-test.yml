name: One-shot Phase 4 acceptance formatter

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/format-p4-acceptance-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/e2e/phase-04-acceptance.spec.ts
      - name: Commit formatted test and remove workflow
        run: |
          git rm .github/workflows/format-p4-acceptance-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/phase-04-acceptance.spec.ts
          git commit -m "style(phase-04): format acceptance test"
          git push origin HEAD:agent/phase-04-temporal
