name: Apply P4-08 repository patch

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/agent-p4-08-apply.yml
      - tools/agent/p4-08-apply.mjs

permissions:
  contents: write

concurrency:
  group: apply-p4-08-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Apply deterministic P4-08 patch
        run: node tools/agent/p4-08-apply.mjs

      - name: Install and format changed files
        env:
          CI: 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm format
          git diff --check

      - name: Commit P4-08 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer packages/sdk shaders tests tools/shader-build docs/research
          git commit -m "feat(pbr): add temporal offscreen MRT output"
          git push origin HEAD:agent/phase-04-temporal

# Trigger revision 1
