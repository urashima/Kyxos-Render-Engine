name: Reset and Deploy Phase 4 Preview

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write

jobs:
  reset-and-dispatch:
    name: Clear stale Pages state and dispatch trusted deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clear stale Pages deployment state
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: '7596a09b47ceb41a67a1073387b43b5014115603',
                headers: { 'X-GitHub-Api-Version': '2026-03-10' },
              });
              core.info('Cancelled stale Pages deployment 7596a09.');
            } catch (error) {
              const alreadyFinished =
                error.status === 400 && String(error.message).includes("it's finished");
              if (error.status !== 404 && !alreadyFinished) throw error;
              core.info(
                alreadyFinished
                  ? 'Stale Pages deployment is already finished; continuing.'
                  : 'Stale Pages deployment was already absent; continuing.',
              );
            }

      - name: Wait for Pages lock release
        run: sleep 15

      - name: Dispatch accepted Pages plus Phase 4 preview
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
