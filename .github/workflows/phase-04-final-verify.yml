name: Phase 4 final verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: phase-04-final-verification
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: github.head_ref == 'phase-04-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - name: Check out final branch
        uses: actions/checkout@v7
        with:
          ref: phase-04-final
          fetch-depth: 0
          show-progress: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Apply final compatibility, tests, Playground, and governance
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          LOG=test-results/phase-04/runtime/phase-04-finalize-patch.log
          : > "$LOG"
          for script in \
            01-compat.mjs \
            02-tests.mjs \
            03-resolve-tests.mjs \
            04-playground.mjs \
            05-docs.mjs
          do
            echo "=== $script ===" | tee -a "$LOG"
            node ".github/scripts/phase-04-finalize/$script" 2>&1 | tee -a "$LOG"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format final sources
        run: pnpm format

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete repository verification
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/phase-04-final-verification.log

      - name: Remove one-shot finalization files
        run: |
          rm -rf .github/scripts/phase-04-finalize
          rm -f .github/workflows/phase-04-final-verify.yml

      - name: Commit verified final checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(phase-04): finalize TRAA and explicit velocity"
          git push origin HEAD:phase-04-final

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-final-verification-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/phase-04/runtime/
            apps/playground/src/acceptance/phase-04/
            packages/renderer/src/
            packages/renderer/test/
            packages/camera/src/temporal-camera.ts
            packages/sdk/src/temporal-pbr.ts
            shaders/webgpu/phase-04-*.wgsl
            WORK_STATUS.md
            docs/execution/PHASE_04_TASKS.md
            docs/execution/WORK_LOG.md
          if-no-files-found: ignore
          retention-days: 7
