      - name: Format canonical Phase 5 checkpoint
        run: |
          pnpm exec prettier --write \
            README.md \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md \
            docs/execution/PHASE_05_TASKS.md \
            docs/execution/WORK_LOG.md \
            docs/research/phase-05-lighting-shadow-postfx-contract.md

      - name: Commit Phase 5 bootstrap and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase-05-bootstrap.yml
          git add \
            README.md \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md \
            docs/execution/PHASE_05_TASKS.md \
            docs/execution/WORK_LOG.md \
            docs/research/phase-05-lighting-shadow-postfx-contract.md
          git commit -m 'docs(phase-05): freeze bootstrap contract and task ledger'
          git push origin HEAD:agent/phase-05-lighting-postfx
