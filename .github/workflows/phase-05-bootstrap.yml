          |    04 | Phase Accepted | `agent/phase-04-public-verification` | #7, #10 | PASS        | Phase Accepted | `phase-04-accepted` |
          |    05 | In Development | `agent/phase-05-lighting-postfx`     | #12     | IN PROGRESS | In Development | —                   |
