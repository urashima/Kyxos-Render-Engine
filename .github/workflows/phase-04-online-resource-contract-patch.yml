name: Patch Phase 4 online resource contract

on:
  push:
    branches:
      - agent/phase-04-public-verification
    paths:
      - .github/workflows/phase-04-online-resource-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-04-public-verification
          persist-credentials: true

      - name: Align online resource lifecycle with lazy warm-up
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/e2e/online-pages.spec.ts')
          source = path.read_text(encoding='utf-8')
          before = '''    await exerciseReset(() => page.locator('[data-action="orbit-right"]').click(), resourceBaseline);
    await exerciseReset(
      () => page.locator('[data-control="roughness"]').fill('0.63'),
      resourceBaseline,
    );
    const warmedResources = await exerciseReset(() =>
      page.locator('[data-action="texture"]').click(),
    );
    expect(warmedResources).toBeGreaterThanOrEqual(resourceBaseline);
    expect(warmedResources).toBeLessThanOrEqual(resourceBaseline + 2);
    await exerciseReset(
      () => page.locator('[data-action="reset-history"]').click(),
      warmedResources,
    );'''
          after = '''    let activeResources = await exerciseReset(() =>
      page.locator('[data-action="orbit-right"]').click(),
    );
    expect(activeResources).toBeGreaterThanOrEqual(resourceBaseline);
    expect(activeResources).toBeLessThanOrEqual(resourceBaseline + 2);
    await exerciseReset(
      () => page.locator('[data-control="roughness"]').fill('0.63'),
      activeResources,
    );
    const textureResources = await exerciseReset(() =>
      page.locator('[data-action="texture"]').click(),
    );
    expect(textureResources).toBeGreaterThanOrEqual(activeResources);
    expect(textureResources).toBeLessThanOrEqual(resourceBaseline + 2);
    activeResources = textureResources;
    await exerciseReset(
      () => page.locator('[data-action="reset-history"]').click(),
      activeResources,
    );'''
          if before not in source:
              raise SystemExit('Expected Phase 4 resource contract block was not found.')
          source = source.replace(before, after, 1)
          source = source.replace(
              "    await expect(page.getByTestId('resource-count')).toHaveText(String(warmedResources));",
              "    await expect(page.getByTestId('resource-count')).toHaveText(String(activeResources));",
              1,
          )
          path.write_text(source, encoding='utf-8')

      - name: Format patched test
        run: |
          corepack enable
          pnpm exec prettier --write tests/e2e/online-pages.spec.ts

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase-04-online-resource-contract-patch.yml
          git add tests/e2e/online-pages.spec.ts
          git commit -m 'test(phase-04): establish post-warm resource baseline'
          git push origin HEAD:agent/phase-04-public-verification
