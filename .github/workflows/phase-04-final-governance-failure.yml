name: Phase 4 final governance failure

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-final-governance-failure.yml

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Capture failed final verification log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 30143027284 --repo "${GITHUB_REPOSITORY}" --log-failed > /tmp/final-governance-failure.log
          tail -n 260 /tmp/final-governance-failure.log

      - name: Upload failed final verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-final-governance-failure
          path: /tmp/final-governance-failure.log
          if-no-files-found: error
