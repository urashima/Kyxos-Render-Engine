name: Phase verification

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: phase-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Full quality and acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Apply pending P4-08 patch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/phase-04-temporal' }}
        run: node tools/agent/p4-08-apply.mjs

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format pending P4-08 patch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/phase-04-temporal' }}
        run: pnpm format

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete verification pipeline
        run: pnpm verify

      - name: Commit verified P4-08 implementation
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/phase-04-temporal' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer packages/sdk shaders tests tools/shader-build docs/research
          git diff --cached --quiet && exit 0
          git commit -m "feat(pbr): add temporal offscreen MRT output"
          git push origin HEAD:agent/phase-04-temporal

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-browser-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/phase-00/runtime/
            test-results/phase-01/runtime/
            test-results/phase-02/runtime/
            test-results/phase-03/runtime/
            test-results/phase-04/runtime/
          if-no-files-found: ignore
          retention-days: 7
