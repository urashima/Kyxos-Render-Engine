name: Phase verification

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: phase-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Full quality and acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate final Phase 4 lifecycle patch
        shell: python
        run: |
          from pathlib import Path
          import re

          backend_path = Path('packages/backend-webgpu/src/backend.ts')
          backend = backend_path.read_text()
          debug_pattern = re.compile(
              r"  debugSimulateDeviceLoss\(\): void \{\n"
              r"\s+this\.#requireDevice\('simulate Device Lost for diagnostics'\)\.destroy\(\);\n"
              r"  \}"
          )
          debug_replacement = """  debugSimulateDeviceLoss(): void {
            const device = this.#requireDevice('simulate Device Lost for diagnostics');
            const generation = this.#deviceGeneration;
            device.destroy();
            this.#handleDeviceLost(
              generation,
              Object.freeze({
                message: 'WebGPU Device Lost was simulated for diagnostics.',
                reason: 'destroyed',
                recoverable: true,
              }),
            );
          }"""
          backend, debug_count = debug_pattern.subn(debug_replacement, backend, count=1)
          if debug_count != 1:
              raise SystemExit(f'Expected one debugSimulateDeviceLoss replacement, got {debug_count}.')
          guard_pattern = re.compile(
              r"    if \(this\.#state === 'disposed' \|\| generation !== this\.#deviceGeneration\) \{\n"
              r"\s+return;\n"
              r"    \}"
          )
          guard_replacement = """    if (
              this.#state === 'disposed' ||
              this.#state === 'lost' ||
              generation !== this.#deviceGeneration
            ) {
              return;
            }"""
          backend, guard_count = guard_pattern.subn(guard_replacement, backend, count=1)
          if guard_count != 1:
              raise SystemExit(f'Expected one Device Lost guard replacement, got {guard_count}.')
          backend_path.write_text(backend)

          backend_test_path = Path('packages/backend-webgpu/test/webgpu-backend.test.ts')
          backend_test = backend_test_path.read_text()
          start_marker = "  it('simulates Device Lost for diagnostics without exposing the native device'"
          start = backend_test.find(start_marker)
          end = backend_test.find('\n  it(', start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('Expected diagnostic Device Lost test boundaries were not found.')
          replacement = """  it('simulates Device Lost synchronously and ignores the later native loss resolution', async () => {
            const device = new FakeDevice();
            const backend = createWebGpuBackendForPlatform(
              {},
              new FakePlatform(true, [new FakeAdapter([], [device])]),
            );
            const onLost = vi.fn();
            backend.on('lost', onLost);
            await backend.initialize();
            backend.createBuffer({ size: 64, usage: ['vertex'] });

            backend.debugSimulateDeviceLoss();

            expect(device.destroy).toHaveBeenCalledTimes(1);
            expect(backend.state).toBe('lost');
            expect(backend.getResourceStatistics().activeCount).toBe(0);
            expect(onLost).toHaveBeenCalledExactlyOnceWith({
              message: 'WebGPU Device Lost was simulated for diagnostics.',
              reason: 'destroyed',
              recoverable: true,
            });

            device.lose({ message: 'native destroyed', reason: 'destroyed', recoverable: true });
            await Promise.resolve();
            expect(onLost).toHaveBeenCalledTimes(1);
          });
          """
          backend_test_path.write_text(backend_test[:start] + replacement + backend_test[end:])

          route_path = Path('apps/playground/src/acceptance/phase-04/index.ts')
          route = route_path.read_text()
          old_surface = """  const surface = renderer.getSurfaceInfo();
            requireElement(root, '[data-testid="surface-size"]').textContent = surface.size.suspended
              ? 'suspended'
              : `${surface.size.physicalWidth}×${surface.size.physicalHeight}`;
            requireElement(root, '[data-testid="surface-dpr"]').textContent =
              surface.size.devicePixelRatio.toFixed(2);
          """
          new_surface = """  if (base.state === 'ready') {
            const surface = renderer.getSurfaceInfo();
            requireElement(root, '[data-testid="surface-size"]').textContent = surface.size.suspended
              ? 'suspended'
              : `${surface.size.physicalWidth}×${surface.size.physicalHeight}`;
            requireElement(root, '[data-testid="surface-dpr"]').textContent =
              surface.size.devicePixelRatio.toFixed(2);
          } else {
            requireElement(root, '[data-testid="surface-size"]').textContent = 'unavailable';
            requireElement(root, '[data-testid="surface-dpr"]').textContent = '—';
          }
          """
          if old_surface not in route:
              raise SystemExit('Expected Phase 4 surface diagnostics block was not found.')
          route_path.write_text(route.replace(old_surface, new_surface, 1))

          acceptance_path = Path('tests/e2e/phase-04-acceptance.spec.ts')
          acceptance = acceptance_path.read_text()
          acceptance = acceptance.replace(
              'const FIXED_VIEWPORT = { height: 1400, width: 1440 };',
              'const FIXED_VIEWPORT = { height: 1600, width: 1440 };',
              1,
          )
          old_visual = """    const currentVisual = await page.getByTestId('phase-04-acceptance').screenshot({
              animations: 'disabled',
            });
          """
          new_visual = """    await page.evaluate(() => window.scrollTo(0, 0));
            await waitForSleeping(page);
            const currentVisual = await page.screenshot({
              animations: 'disabled',
              fullPage: false,
            });
          """
          if old_visual not in acceptance:
              raise SystemExit('Expected Phase 4 visual capture block was not found.')
          acceptance = acceptance.replace(old_visual, new_visual, 1)
          old_loss = """    await expect(page.getByTestId('renderer-state')).toHaveText('lost');
            await expect(page.getByTestId('resource-count')).toHaveText('0');
          """
          new_loss = """    await expect(page.getByTestId('renderer-state')).toHaveText('lost');
            await expect(page.getByTestId('resource-count')).toHaveText('0');
            await expect(page.getByTestId('surface-size')).toHaveText('unavailable');
          """
          if old_loss not in acceptance:
              raise SystemExit('Expected Phase 4 Device Lost assertion block was not found.')
          acceptance_path.write_text(acceptance.replace(old_loss, new_loss, 1))
          print('patched backend=1, backend-test=1, route=1, acceptance=1')

      - name: Format patched source
        run: >-
          pnpm exec prettier --write
          packages/backend-webgpu/src/backend.ts
          packages/backend-webgpu/test/webgpu-backend.test.ts
          apps/playground/src/acceptance/phase-04/index.ts
          tests/e2e/phase-04-acceptance.spec.ts

      - name: Upload final lifecycle patch
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-final-lifecycle-patch-${{ github.run_attempt }}
          path: |
            packages/backend-webgpu/src/backend.ts
            packages/backend-webgpu/test/webgpu-backend.test.ts
            apps/playground/src/acceptance/phase-04/index.ts
            tests/e2e/phase-04-acceptance.spec.ts
          if-no-files-found: error
          retention-days: 1

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete verification pipeline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/phase-verification.log

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-browser-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/phase-00/runtime/
            test-results/phase-01/runtime/
            test-results/phase-02/runtime/
            test-results/phase-03/runtime/
            test-results/phase-04/runtime/
          if-no-files-found: ignore
          retention-days: 7
