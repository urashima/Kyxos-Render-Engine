name: Phase verification

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: phase-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Capture deterministic Phase 4 visual candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Make the reviewed visual state deterministic
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/e2e/phase-04-acceptance.spec.ts')
          source = path.read_text(encoding='utf-8')
          before = """    await recordSettled('animation-stop');

    await page.setViewportSize(RESIZED_VIEWPORT);
"""
          after = """    await recordSettled('animation-stop');

    await page.getByRole('button', { name: 'Reset scene' }).click();
    await waitForSleeping(page);
    await expect(page.getByTestId('resource-count')).toHaveText(String(initialResources));
    await page.getByRole('button', { name: 'Orbit right' }).click();
    await waitForSleeping(page);
    await page.locator('[data-control=\"roughness\"]').fill('0.63');
    await expect(page.locator('[data-output=\"roughness\"]')).toHaveText('0.63');
    await waitForSleeping(page);

    await page.setViewportSize(RESIZED_VIEWPORT);
"""
          if before not in source:
              raise SystemExit('Phase 4 deterministic visual insertion point was not found.')
          path.write_text(source.replace(before, after, 1), encoding='utf-8')

      - name: Format candidate source
        run: pnpm exec prettier --write tests/e2e/phase-04-acceptance.spec.ts

      - name: Run fail-closed candidate capture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          set +e
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/phase-verification.log
          verify_status=${PIPESTATUS[0]}
          set -e
          if [ "$verify_status" -eq 0 ]; then
            echo 'Candidate unexpectedly matched the frozen reference; review is still required.'
            exit 1
          fi
          grep -q '1 failed' test-results/phase-04/runtime/phase-verification.log
          grep -q '32 passed' test-results/phase-04/runtime/phase-verification.log
          grep -q 'phase-04-acceptance.spec.ts' test-results/phase-04/runtime/phase-verification.log
          grep -q 'toMatchSnapshot' test-results/phase-04/runtime/phase-verification.log
          test -f test-results/phase-04/runtime/acceptance-visual/current.png
          echo 'The only expected failure is the old Phase 4 visual reference.'

      - name: Upload deterministic visual candidate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-deterministic-visual-candidate-${{ github.run_attempt }}
          path: |
            tests/e2e/phase-04-acceptance.spec.ts
            playwright-report/
            test-results/phase-00/runtime/
            test-results/phase-04/runtime/
          if-no-files-found: error
          retention-days: 7
