name: Phase verification

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: phase-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Full quality and acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate deterministic diagnostic loss patch
        shell: python
        run: |
          from pathlib import Path

          backend_path = Path('packages/backend-webgpu/src/backend.ts')
          backend = backend_path.read_text()
          old_debug = """  debugSimulateDeviceLoss(): void {
            this.#requireDevice('simulate Device Lost for diagnostics').destroy();
          }
          """
          new_debug = """  debugSimulateDeviceLoss(): void {
            const device = this.#requireDevice('simulate Device Lost for diagnostics');
            const generation = this.#deviceGeneration;
            device.destroy();
            this.#handleDeviceLost(
              generation,
              Object.freeze({
                message: 'WebGPU Device Lost was simulated for diagnostics.',
                reason: 'destroyed',
                recoverable: true,
              }),
            );
          }
          """
          if old_debug not in backend:
              raise SystemExit('Expected debugSimulateDeviceLoss implementation was not found.')
          backend = backend.replace(old_debug, new_debug, 1)
          old_guard = """    if (this.#state === 'disposed' || generation !== this.#deviceGeneration) {
              return;
            }
          """
          new_guard = """    if (
              this.#state === 'disposed' ||
              this.#state === 'lost' ||
              generation !== this.#deviceGeneration
            ) {
              return;
            }
          """
          if old_guard not in backend:
              raise SystemExit('Expected Device Lost guard was not found.')
          backend_path.write_text(backend.replace(old_guard, new_guard, 1))

          test_path = Path('packages/backend-webgpu/test/webgpu-backend.test.ts')
          test = test_path.read_text()
          old_test = """  it('simulates Device Lost for diagnostics without exposing the native device', async () => {
            const device = new FakeDevice();
            const backend = createWebGpuBackendForPlatform(
              {},
              new FakePlatform(true, [new FakeAdapter([], [device])]),
            );
            await backend.initialize();

            backend.debugSimulateDeviceLoss();
            expect(device.destroy).toHaveBeenCalledTimes(1);
            device.lose({ message: 'diagnostic loss', reason: 'destroyed', recoverable: true });
            await vi.waitFor(() => expect(backend.state).toBe('lost'));
          });
          """
          new_test = """  it('simulates Device Lost synchronously and ignores the later native loss resolution', async () => {
            const device = new FakeDevice();
            const backend = createWebGpuBackendForPlatform(
              {},
              new FakePlatform(true, [new FakeAdapter([], [device])]),
            );
            const onLost = vi.fn();
            backend.on('lost', onLost);
            await backend.initialize();
            backend.createBuffer({ size: 64, usage: ['vertex'] });

            backend.debugSimulateDeviceLoss();

            expect(device.destroy).toHaveBeenCalledTimes(1);
            expect(backend.state).toBe('lost');
            expect(backend.getResourceStatistics().activeCount).toBe(0);
            expect(onLost).toHaveBeenCalledExactlyOnceWith({
              message: 'WebGPU Device Lost was simulated for diagnostics.',
              reason: 'destroyed',
              recoverable: true,
            });

            device.lose({ message: 'native destroyed', reason: 'destroyed', recoverable: true });
            await Promise.resolve();
            expect(onLost).toHaveBeenCalledTimes(1);
          });
          """
          if old_test not in test:
              raise SystemExit('Expected diagnostic Device Lost test was not found.')
          test_path.write_text(test.replace(old_test, new_test, 1))

      - name: Format patched source
        run: pnpm exec prettier --write packages/backend-webgpu/src/backend.ts packages/backend-webgpu/test/webgpu-backend.test.ts

      - name: Upload deterministic loss patch
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-device-loss-patch-${{ github.run_attempt }}
          path: |
            packages/backend-webgpu/src/backend.ts
            packages/backend-webgpu/test/webgpu-backend.test.ts
          if-no-files-found: error
          retention-days: 1

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete verification pipeline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/phase-verification.log

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-browser-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/phase-00/runtime/
            test-results/phase-01/runtime/
            test-results/phase-02/runtime/
            test-results/phase-03/runtime/
            test-results/phase-04/runtime/
          if-no-files-found: ignore
          retention-days: 7
