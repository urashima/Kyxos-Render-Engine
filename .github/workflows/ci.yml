name: Phase verification

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: phase-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Full quality and acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Synchronize Phase 4 provenance
        shell: bash
        run: |
          git fetch origin agent/phase-04-worklog-export
          git show FETCH_HEAD:.github/scripts/sync-phase-04-provenance.py > /tmp/sync-phase-04-provenance.py
          python /tmp/sync-phase-04-provenance.py

      - name: Align active-task governance state
        shell: python
        run: |
          from pathlib import Path

          status_path = Path('WORK_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          status = status.replace(
              '- **Overall Progress:** 4 / 15 phases accepted; P4-01 through P4-12 development and pre-deployment evidence complete',
              '- **Overall Progress:** 4 / 15 phases accepted; P4-01 through P4-11 completed; P4-12 implementation and pre-deployment evidence verified',
          )
          status = status.replace(
              '- **Current Task:** Phase 4 final provenance, merge, public Pages verification, and immutable acceptance freeze',
              '- **Current Task:** P4-12 — Final provenance, merge, public Pages verification, and immutable acceptance freeze',
          )
          status = status.replace(
              '- **Last Completed Task:** P4-12 — public Temporal PBR Canvas lifecycle, independent acceptance Playground, and fail-closed evidence package',
              '- **Last Completed Task:** P4-11 — ordered PBR MRT → Dynamic TAA → optional Static Accumulation → Present transaction with native Scheduler/WebGPU evidence',
          )
          status = status.replace(
              '- **Next Action:** Require the exact provenance-only Head to pass `pnpm verify`, then mark PR #7 ready and merge with expected-Head protection',
              '- **Next Action:** Keep the provenance-only Head green, inspect PR #7 reviews, then mark it ready and merge with expected-Head protection',
          )
          status = status.replace(
              '- **CI Status:** Evidence Head passed complete `pnpm verify`; final provenance-only Head pending',
              '- **CI Status:** Evidence Head passed complete `pnpm verify`; provenance-only Head must remain green before merge',
          )
          status_path.write_text(status, encoding='utf-8')

          tasks_path = Path('docs/execution/PHASE_04_TASKS.md')
          tasks = tasks_path.read_text(encoding='utf-8')
          lines = []
          for line in tasks.splitlines():
              if line.startswith('| P4-12 '):
                  line = line.rsplit('| Completed |', 1)[0] + '| In Development |'
              lines.append(line)
          tasks = '\n'.join(lines) + '\n'
          tasks = tasks.replace(
              'All Phase 4 development tasks are complete and the exact evidence Head passed the complete read-only\n`pnpm verify` pipeline. Phase 4 remains **Deployment Pending** until all of the following are true:',
              'P4-12 implementation and pre-deployment evidence are complete, and the exact evidence Head passed the\ncomplete read-only `pnpm verify` pipeline. P4-12 remains **In Development** and Phase 4 remains\n**Deployment Pending** until all of the following are true:',
          )
          tasks_path.write_text(tasks, encoding='utf-8')

          log_path = Path('docs/execution/WORK_LOG.md')
          log = log_path.read_text(encoding='utf-8')
          log = log.replace(
              '- P4-12 is development-complete. Phase 4 remains deployment-pending and has no accepted Tag.',
              '- P4-12 implementation and pre-deployment evidence are complete; the task remains In Development until the public acceptance gate passes.',
          )
          log_path.write_text(log, encoding='utf-8')

      - name: Format canonical documents
        run: pnpm exec prettier --write WORK_STATUS.md docs/execution/PHASE_04_TASKS.md docs/execution/WORK_LOG.md

      - name: Run complete verification pipeline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/phase-verification.log

      - name: Commit and push verified provenance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_STATUS.md docs/execution/PHASE_04_TASKS.md docs/execution/WORK_LOG.md
          if git diff --cached --quiet; then
            echo 'No provenance changes to push.'
            exit 0
          fi
          git commit -m 'docs(phase-04): record evidence head provenance'
          git push origin HEAD:agent/phase-04-temporal

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-browser-diagnostics-${{ github.run_attempt }}
          path: |
            docs/execution/WORK_LOG.md
            playwright-report/
            test-results/phase-00/runtime/
            test-results/phase-01/runtime/
            test-results/phase-02/runtime/
            test-results/phase-03/runtime/
            test-results/phase-04/runtime/
          if-no-files-found: ignore
          retention-days: 7
