name: Phase verification

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: phase-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Full quality and acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Integrate pending P4-09 exports and Shader mirror
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/phase-04-temporal' }}
        shell: bash
        run: |
          cat > /tmp/p4-09-integrate.mjs <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';

          function replaceOnce(source, search, replacement, label) {
            const index = source.indexOf(search);
            if (index < 0) throw new Error(`P4-09 integration anchor not found: ${label}`);
            if (source.indexOf(search, index + search.length) >= 0) {
              throw new Error(`P4-09 integration anchor is not unique: ${label}`);
            }
            return source.slice(0, index) + replacement + source.slice(index + search.length);
          }

          const presentPath = 'packages/renderer/src/dynamic-taa-present-pass.ts';
          let present = await readFile(presentPath, 'utf8');
          present = replaceOnce(
            present,
            '  createPbrOutputTransform,\n  type PbrOutputTransform,\n  type PbrOutputTransformDescriptor,',
            '  type PbrOutputTransform,\n  type PbrOutputTransformDescriptor,\n  createPbrOutputTransform,',
            'Present material import ordering',
          );
          await writeFile(presentPath, present);

          const sdkPath = 'packages/sdk/src/index.ts';
          let sdk = await readFile(sdkPath, 'utf8');
          sdk = replaceOnce(
            sdk,
            '  DynamicTaaGpuHistorySize,\n  DynamicTaaResolvePassDiagnostics,',
            '  DynamicTaaGpuHistorySize,\n  DynamicTaaPresentPassDiagnostics,\n  DynamicTaaPresentPassInput,\n  DynamicTaaPresentPassOptions,\n  DynamicTaaResolvePassDiagnostics,',
            'SDK Present type exports',
          );
          sdk = replaceOnce(
            sdk,
            '  DYNAMIC_TAA_RESOLVE_UNIFORM_LAYOUT,\n  PBR_OBJECT_UNIFORM_LAYOUT,',
            '  DYNAMIC_TAA_PRESENT_UNIFORM_LAYOUT,\n  DYNAMIC_TAA_RESOLVE_UNIFORM_LAYOUT,\n  PBR_OBJECT_UNIFORM_LAYOUT,',
            'SDK Present uniform export',
          );
          sdk = replaceOnce(
            sdk,
            '  DynamicTaaGpuHistory,\n  DynamicTaaResolvePass,',
            '  DynamicTaaGpuHistory,\n  DynamicTaaPresentPass,\n  DynamicTaaResolvePass,',
            'SDK Present class export',
          );
          sdk = replaceOnce(
            sdk,
            '  packPbrObjectUniforms,\n  packDynamicTaaResolveUniforms,',
            '  packPbrObjectUniforms,\n  packDynamicTaaPresentUniforms,\n  packDynamicTaaResolveUniforms,',
            'SDK Present packer export',
          );
          await writeFile(sdkPath, sdk);

          const validatorPath = 'tools/shader-build/validate-shaders.mjs';
          let validator = await readFile(validatorPath, 'utf8');
          validator = replaceOnce(
            validator,
            "  [\n    'webgpu/phase-04-taa-resolve.wgsl',",
            "  [\n    'webgpu/phase-04-taa-present.wgsl',\n    {\n      exportName: 'PHASE_04_TAA_PRESENT_WGSL',\n      path: 'packages/renderer/src/generated/phase-04-taa-present.wgsl.ts',\n    },\n  ],\n  [\n    'webgpu/phase-04-taa-resolve.wgsl',",
            'P4-09 Shader mirror',
          );
          await writeFile(validatorPath, validator);
          EOF
          node /tmp/p4-09-integrate.mjs

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format pending P4-09 files
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/phase-04-temporal' }}
        run: pnpm format

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete verification pipeline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/p4-09-verify.log

      - name: Commit verified P4-09 integration
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/phase-04-temporal' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-p4-09-verify.yml
          git add packages/renderer packages/sdk shaders tests tools/shader-build
          git diff --cached --quiet && exit 0
          git commit -m "feat(temporal): integrate final TAA present pass"
          git push origin HEAD:agent/phase-04-temporal

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-browser-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/phase-00/runtime/
            test-results/phase-01/runtime/
            test-results/phase-02/runtime/
            test-results/phase-03/runtime/
            test-results/phase-04/runtime/
          if-no-files-found: ignore
          retention-days: 7
