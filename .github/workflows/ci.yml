name: Phase verification

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: phase-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Full quality and acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate deterministic diagnostic loss patch
        shell: python
        run: |
          from pathlib import Path
          import re

          backend_path = Path('packages/backend-webgpu/src/backend.ts')
          backend = backend_path.read_text()
          debug_pattern = re.compile(
              r"  debugSimulateDeviceLoss\(\): void \{\n"
              r"\s+this\.#requireDevice\('simulate Device Lost for diagnostics'\)\.destroy\(\);\n"
              r"  \}"
          )
          debug_replacement = """  debugSimulateDeviceLoss(): void {
            const device = this.#requireDevice('simulate Device Lost for diagnostics');
            const generation = this.#deviceGeneration;
            device.destroy();
            this.#handleDeviceLost(
              generation,
              Object.freeze({
                message: 'WebGPU Device Lost was simulated for diagnostics.',
                reason: 'destroyed',
                recoverable: true,
              }),
            );
          }"""
          backend, debug_count = debug_pattern.subn(debug_replacement, backend, count=1)
          if debug_count != 1:
              raise SystemExit(f'Expected one debugSimulateDeviceLoss replacement, got {debug_count}.')

          guard_pattern = re.compile(
              r"    if \(this\.#state === 'disposed' \|\| generation !== this\.#deviceGeneration\) \{\n"
              r"\s+return;\n"
              r"    \}"
          )
          guard_replacement = """    if (
              this.#state === 'disposed' ||
              this.#state === 'lost' ||
              generation !== this.#deviceGeneration
            ) {
              return;
            }"""
          backend, guard_count = guard_pattern.subn(guard_replacement, backend, count=1)
          if guard_count != 1:
              raise SystemExit(f'Expected one Device Lost guard replacement, got {guard_count}.')
          backend_path.write_text(backend)

          test_path = Path('packages/backend-webgpu/test/webgpu-backend.test.ts')
          test = test_path.read_text()
          start_marker = "  it('simulates Device Lost for diagnostics without exposing the native device'"
          start = test.find(start_marker)
          end = test.find('\n  it(', start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('Expected diagnostic Device Lost test boundaries were not found.')
          replacement = """  it('simulates Device Lost synchronously and ignores the later native loss resolution', async () => {
            const device = new FakeDevice();
            const backend = createWebGpuBackendForPlatform(
              {},
              new FakePlatform(true, [new FakeAdapter([], [device])]),
            );
            const onLost = vi.fn();
            backend.on('lost', onLost);
            await backend.initialize();
            backend.createBuffer({ size: 64, usage: ['vertex'] });

            backend.debugSimulateDeviceLoss();

            expect(device.destroy).toHaveBeenCalledTimes(1);
            expect(backend.state).toBe('lost');
            expect(backend.getResourceStatistics().activeCount).toBe(0);
            expect(onLost).toHaveBeenCalledExactlyOnceWith({
              message: 'WebGPU Device Lost was simulated for diagnostics.',
              reason: 'destroyed',
              recoverable: true,
            });

            device.lose({ message: 'native destroyed', reason: 'destroyed', recoverable: true });
            await Promise.resolve();
            expect(onLost).toHaveBeenCalledTimes(1);
          });
          """
          test_path.write_text(test[:start] + replacement + test[end:])
          print(f'patched debug={debug_count}, guard={guard_count}, test=1')

      - name: Format patched source
        run: pnpm exec prettier --write packages/backend-webgpu/src/backend.ts packages/backend-webgpu/test/webgpu-backend.test.ts

      - name: Upload deterministic loss patch
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-device-loss-patch-${{ github.run_attempt }}
          path: |
            packages/backend-webgpu/src/backend.ts
            packages/backend-webgpu/test/webgpu-backend.test.ts
          if-no-files-found: error
          retention-days: 1

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete verification pipeline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/phase-verification.log

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-browser-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/phase-00/runtime/
            test-results/phase-01/runtime/
            test-results/phase-02/runtime/
            test-results/phase-03/runtime/
            test-results/phase-04/runtime/
          if-no-files-found: ignore
          retention-days: 7
