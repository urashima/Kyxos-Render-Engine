name: Phase verification

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: phase-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Full quality and acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format temporal diagnostics files
        run: |
          pnpm exec prettier --write \
            packages/frame-scheduler/src/temporal-scheduler.ts \
            packages/frame-scheduler/test/temporal-scheduler-pending.test.ts \
            tests/e2e/phase-04-acceptance.spec.ts

      - name: Upload formatted temporal diagnostics files
        uses: actions/upload-artifact@v7
        with:
          name: temporal-diagnostics-formatted-${{ github.run_attempt }}
          path: |
            packages/frame-scheduler/src/temporal-scheduler.ts
            packages/frame-scheduler/test/temporal-scheduler-pending.test.ts
            tests/e2e/phase-04-acceptance.spec.ts
          if-no-files-found: error
          retention-days: 1

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete verification pipeline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/phase-verification.log

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-browser-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/phase-00/runtime/
            test-results/phase-01/runtime/
            test-results/phase-02/runtime/
            test-results/phase-03/runtime/
            test-results/phase-04/runtime/
          if-no-files-found: ignore
          retention-days: 7
