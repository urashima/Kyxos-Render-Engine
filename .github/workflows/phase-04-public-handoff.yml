name: Phase 4 public handoff

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-public-handoff.yml

permissions:
  actions: read
  contents: write
  deployments: read

jobs:
  record-evidence:
    name: Record verified Phase 4 public evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MERGE_SHA: f926f544c94da2c5ea8f9630c959398b15d2d84f
      PUBLIC_VERIFY_RUN: '30094335571'
    steps:
      - name: Check out handoff branch
        uses: actions/checkout@v7
        with:
          ref: phase-04-final-handoff
          fetch-depth: 0

      - name: Append CI, Pages, and public route evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          repo = os.environ['REPOSITORY']
          sha = os.environ['MERGE_SHA']
          public_run_id = int(os.environ['PUBLIC_VERIFY_RUN'])
          token = os.environ['GH_TOKEN']

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'User-Agent': 'Kyxos-Phase-04-Handoff',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          runs = get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100')['workflow_runs']
          main_ci = next(
              run
              for run in runs
              if run['name'] == 'Phase verification'
              and run['event'] == 'push'
              and run['head_sha'] == sha
          )
          if main_ci['status'] != 'completed' or main_ci['conclusion'] != 'success':
              raise SystemExit(f'Main CI is not successful: {main_ci}')

          deployments = get(f'https://api.github.com/repos/{repo}/deployments?sha={sha}&per_page=100')
          pages = next(deployment for deployment in deployments if deployment.get('environment') == 'github-pages')
          statuses = get(pages['statuses_url'])
          pages_status = statuses[0]
          if pages_status['state'] != 'success':
              raise SystemExit(f'Pages deployment is not successful: {pages_status}')

          pages_run = next(
              (
                  run
                  for run in runs
                  if run['head_sha'] == sha
                  and ('page' in run['name'].lower() or 'deploy' in run['name'].lower())
              ),
              None,
          )

          public_jobs = get(f'https://api.github.com/repos/{repo}/actions/runs/{public_run_id}/jobs?per_page=100')['jobs']
          public_job = public_jobs[0]
          steps = {step['name']: step for step in public_job['steps']}
          for step_name in ('Wait for main CI and Pages deployment', 'Verify public Phase 4 and latest routes'):
              step = steps[step_name]
              if step['status'] != 'completed' or step['conclusion'] != 'success':
                  raise SystemExit(f'Public verification step did not pass: {step_name}: {step}')

          timestamp = datetime.now(ZoneInfo('America/Los_Angeles')).strftime('%Y-%m-%d %H:%M PDT')
          pages_run_evidence = str(pages_run['id']) if pages_run is not None else 'deployment API evidence'
          log_path = Path('docs/execution/WORK_LOG.md')
          with log_path.open('a', encoding='utf-8') as log:
              log.write(
                  f'''\n## {timestamp} — P4-14 merge, Pages acceptance, and Phase 5 handoff\n\n### Completed\n\n- Marked PR #16 ready after trusted standard CI and squash-merged it to `main` as `{sha}`.\n- Preserved the accepted forward temporal architecture while adding explicit rigid-object Velocity and the complete compatible TRAA control surface.\n- Verified the deployed Phase 4 and Latest routes against the exact merge Commit and all 13 public TAA controls.\n- Closed the implementation and public acceptance gates; the remaining governance checkpoint transfers the unique current action to Phase 5 Draft PR #12 synchronization.\n\n### Validation\n\n- Final pre-merge `pnpm verify`: PASS — Run `30085244188`, job `89455803547`.\n- Trusted standard PR CI: PASS — Run `30093376943`.\n- Main CI: PASS — Run `{main_ci['id']}`.\n- Pages deployment: PASS — deployment `{pages['id']}`, run/evidence `{pages_run_evidence}`.\n- Public Chromium acceptance: PASS — Run `{public_run_id}`.\n- Public Phase 4 route: Commit `{sha}`, 13 / 13 TAA controls.\n- Public Latest route: Commit `{sha}`, 13 / 13 TAA controls.\n\n### Next\n\n- Synchronize `agent/phase-05-lighting-postfx` / Draft PR #12 with current `main`, preserve P5-01 and existing P5-02 work, and run complete `pnpm verify`.\n'''
              )

          evidence = {
              'main_ci_run_id': main_ci['id'],
              'pages_deployment_id': pages['id'],
              'pages_run_id': pages_run['id'] if pages_run is not None else None,
              'public_verify_run_id': public_run_id,
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          Path('.github/workflows/phase-04-public-handoff.yml').unlink()
          PY

      - name: Commit append-only evidence checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/execution/WORK_LOG.md .github/workflows/phase-04-public-handoff.yml
          git commit -m "docs(phase-04): append final public acceptance evidence"
          git push origin HEAD:phase-04-final-handoff
