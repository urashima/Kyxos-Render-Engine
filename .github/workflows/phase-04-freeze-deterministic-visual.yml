name: Freeze Phase 4 deterministic visual

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/phase-04-freeze-deterministic-visual.yml

concurrency:
  group: phase-04-freeze-deterministic-visual
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  freeze:
    name: Promote reviewed candidate and synchronize ledgers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Download reviewed candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8560223373/zip" \
            --output /tmp/phase-04-candidate.zip
          rm -rf /tmp/phase-04-candidate
          mkdir -p /tmp/phase-04-candidate
          unzip -q /tmp/phase-04-candidate.zip -d /tmp/phase-04-candidate
          test -f /tmp/phase-04-candidate/test-results/phase-04/runtime/acceptance-visual/current.png

      - name: Freeze candidate and update canonical evidence
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          from pathlib import Path

          candidate = Path(
              '/tmp/phase-04-candidate/test-results/phase-04/runtime/acceptance-visual/current.png'
          )
          candidate_bytes = candidate.read_bytes()
          candidate_hash = hashlib.sha256(candidate_bytes).hexdigest()
          expected_hash = '0fd501b1e132aaae53b411d49f00bf18c5e4b71e3cbf7c49a297cf70c2b185ea'
          if candidate_hash != expected_hash or len(candidate_bytes) != 448368:
              raise SystemExit(
                  f'Unexpected reviewed candidate: sha256={candidate_hash}, bytes={len(candidate_bytes)}'
              )

          visual = Path('visual-baselines/phase-04')
          shutil.copyfile(candidate, visual / 'reference.png')
          shutil.copyfile(candidate, visual / 'current.png')

          metadata_path = visual / 'metadata.json'
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          for label in ('reference', 'current'):
              metadata['files'][label].update(
                  {
                      'bytes': len(candidate_bytes),
                      'height': 1600,
                      'sha256': candidate_hash,
                      'width': 1440,
                  }
              )
          metadata['comparison'] = {
              'status': 'PASS',
              'threshold': 0.2,
              'maximumDiffPixels': 0,
              'actualDiffPixels': 0,
          }
          metadata['canonicalProvenance']['deterministicVisualRepair'] = {
              'cause': 'The prior frozen visual inherited a variable number of animation RAF orbit increments before capture.',
              'repairCommit': 'c11354126b935d951d61e7992d84212494c3efb5',
              'candidateRunId': 29998770570,
              'candidateJobId': 89178678725,
              'candidateArtifactId': 8560223373,
              'candidateArtifactDigest': 'sha256:2b45479e55901ec57298feea17abc4bf924fece9f9201c5202180f5d3e9276f3',
              'firstAttemptSha256': '1b350490a6842437137eda3efd2d852b4bae9525fc5e97039016064440d89909',
              'retrySha256': candidate_hash,
              'crossRetryThreshold': 0.2,
              'crossRetryDiffPixels': 0,
              'reviewStatus': 'PASS',
          }
          metadata['subjectiveReview']['controls'] = (
              'The fixed public Reset scene, Orbit right, and Roughness 0.63 sequence is visible, '
              'aligned, unclipped, and repeatable.'
          )
          metadata_path.write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')

          automated_path = Path('test-results/phase-04/automated-summary.json')
          automated = json.loads(automated_path.read_text(encoding='utf-8'))
          automated['generatedAt'] = '2026-07-23T03:30:00-07:00'
          automated['notes'] = [
              'Run 29991223373 passed all 33 browser/WebGPU cases and the original zero-difference Phase 4 visual gate.',
              'Run 29998770570 isolated a variable post-animation camera input; its two repaired candidates have zero thresholded cross-retry differences at 0.2.',
              'Artifact 8560223373 supplies the reviewed deterministic visual now frozen without changing thresholds.',
              'GPU timestamp duration remains unavailable through the public diagnostics contract and is not synthesized.',
          ]
          automated_path.write_text(json.dumps(automated, indent=2) + '\n', encoding='utf-8')

          status_path = Path('WORK_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          replacements = {
              'P4-12 implementation and pre-deployment evidence verified':
                  'P4-12 implementation and deterministic pre-deployment evidence verified',
              'Keep the provenance-only Head green, inspect PR #7 reviews, then mark it ready and merge with expected-Head protection':
                  'Require the exact deterministic visual-baseline Head to pass the complete `pnpm verify` gate, then freeze final CI provenance',
              'Evidence Head passed complete `pnpm verify`; provenance-only Head must remain green before merge':
                  'Deterministic repair candidate passed every nonvisual gate and 32 browser/WebGPU cases; baseline-promotion Head pending',
              'merge, public verification, and accepted tag pending':
                  'final CI, merge, public verification, and accepted tag pending',
              '2026-07-23 02:30 PDT': '2026-07-23 03:30 PDT',
          }
          for before, after in replacements.items():
              if before not in status:
                  raise SystemExit(f'WORK_STATUS replacement source missing: {before}')
              status = status.replace(before, after, 1)
          status_path.write_text(status, encoding='utf-8')

          tasks_path = Path('docs/execution/PHASE_04_TASKS.md')
          tasks = tasks_path.read_text(encoding='utf-8')
          old_row = (
              '| P4-12 | Expose public Temporal PBR Canvas lifecycle and independent Phase 4 acceptance Playground'
          )
          rows = tasks.splitlines()
          for index, line in enumerate(rows):
              if line.startswith(old_row):
                  columns = line.split('|')
                  columns[4] = (
                      ' SDK-only route, public operations, deterministic post-animation reset, reviewed '
                      'zero-diff visual, fail-closed evidence/checker and CI   '
                  )
                  rows[index] = '|'.join(columns)
                  break
          else:
              raise SystemExit('P4-12 task row was not found.')
          tasks = '\n'.join(rows) + '\n'
          old_gate = (
              'P4-12 implementation and pre-deployment evidence are complete, and the exact evidence Head passed the\n'
              'complete read-only `pnpm verify` pipeline. P4-12 remains **In Development** and Phase 4 remains\n'
              '**Deployment Pending** until all of the following are true:\n\n'
              '- the provenance-only final PR Head passes the complete pinned CI gate without source drift;'
          )
          new_gate = (
              'P4-12 implementation and pre-deployment evidence are complete. The visual gate now rebuilds one fixed\n'
              'public state after animation so a variable RAF count cannot leak into the frozen screenshot. P4-12\n'
              'remains **In Development** and Phase 4 remains **Deployment Pending** until all of the following are\n'
              'true:\n\n'
              '- the deterministic visual-baseline Head passes the complete pinned CI gate without source drift;\n'
              '- final CI provenance is recorded in the canonical task/status/log documents;'
          )
          if old_gate not in tasks:
              raise SystemExit('Phase 4 deployment gate source text was not found.')
          tasks_path.write_text(tasks.replace(old_gate, new_gate, 1), encoding='utf-8')

          log_path = Path('docs/execution/WORK_LOG.md')
          log = log_path.read_text(encoding='utf-8')
          marker = '## 2026-07-23 03:30 PDT — P4-12 deterministic visual input repaired'
          entry = '''

          ## 2026-07-23 03:30 PDT — P4-12 deterministic visual input repaired

          ### Completed

          - Traced the post-provenance visual drift to the acceptance script inheriting a variable number of
            animation RAF orbit increments before the frozen screenshot.
          - Preserved the zero-pixel visual contract and added a public `Reset scene` → fixed `Orbit right` →
            fixed Roughness `0.63` sequence after animation verification.
          - Reviewed the resulting 1440×1600 Temporal PBR acceptance candidate and approved it for baseline
            promotion; no renderer implementation, visual threshold, or accepted Phase 0–3 artifact changed.

          ### Validation

          - Repair Commit `c11354126b935d951d61e7992d84212494c3efb5` ran through GitHub Actions Run
            `29998770570`, job `89178678725`.
          - Formatting, zero-warning lint, strict typecheck, 62 unit files / 275 tests, architecture and
            documentation governance, all builds and budgets, Pages build verification, and 32 nonvisual
            browser/WebGPU cases passed.
          - The old Reference was the sole failure: 1,945 differing pixels on the first attempt and 1,948 on
            retry, exactly where the now-fixed camera/highlight state changed.
          - Artifact `8560223373`, digest
            `sha256:2b45479e55901ec57298feea17abc4bf924fece9f9201c5202180f5d3e9276f3`,
            preserves both attempts and the authoritative candidate.
          - The two candidate attempts differ only in low-order GPU values: 3,360 raw pixels, maximum channel
            delta 4, and **0** pixels at the frozen Playwright threshold `0.2`.

          ### Next

          - Freeze the reviewed candidate as Phase 4 Reference and Current with a zero-difference image.
          - Require the exact baseline-promotion Head to pass the complete `pnpm verify` pipeline before
            recording final CI provenance.
          '''
          if marker not in log:
              log_path.write_text(log.rstrip() + entry + '\n', encoding='utf-8')

      - name: Format synchronized documents
        run: |
          pnpm exec prettier --write \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md \
            docs/execution/WORK_LOG.md \
            test-results/phase-04/automated-summary.json \
            visual-baselines/phase-04/metadata.json

      - name: Commit frozen deterministic visual
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase-04-freeze-deterministic-visual.yml
          git add \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md \
            docs/execution/WORK_LOG.md \
            test-results/phase-04/automated-summary.json \
            visual-baselines/phase-04/reference.png \
            visual-baselines/phase-04/current.png \
            visual-baselines/phase-04/metadata.json
          git commit -m 'test(phase-04): freeze deterministic visual baseline'
          git push origin HEAD:agent/phase-04-temporal
