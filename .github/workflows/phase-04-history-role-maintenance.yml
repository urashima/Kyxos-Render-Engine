name: Phase 4 History role maintenance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-history-role-maintenance.yml
      - .github/scripts/apply-phase-04-history-role-fix.py

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out maintenance source
        uses: actions/checkout@v7
        with:
          ref: main
          path: maintenance

      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: phase-04-history-role-stability
          fetch-depth: 0
          path: repair

      - name: Apply deterministic source and regression patch
        working-directory: repair
        run: python ../maintenance/.github/scripts/apply-phase-04-history-role-fix.py

      - name: Commit patch to repair PR
        working-directory: repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/renderer/src/dynamic-taa-gpu-history.ts \
            packages/renderer/src/static-accumulation-gpu-history.ts \
            packages/renderer/test/dynamic-taa-gpu-history.test.ts \
            packages/renderer/test/static-accumulation-gpu-history.test.ts \
            packages/renderer/test/temporal-pipeline-transaction.test.ts
          git commit -m "fix(phase-04): stabilize History reset resource roles"
          git push origin HEAD:phase-04-history-role-stability
