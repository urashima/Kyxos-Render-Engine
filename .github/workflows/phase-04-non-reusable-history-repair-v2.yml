name: Phase 4 non-reusable History repair v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-non-reusable-history-repair-v2.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: true
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: phase-04-non-reusable-history-roles
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply canonical non-reusable History roles and regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'packages/renderer/src/dynamic-taa-gpu-history.ts',
              '    const historyValid = this.#history.isReusable(candidate);\n'
              '    this.#frameSignature = candidate;\n',
              '    const historyValid = this.#history.isReusable(candidate);\n'
              '    if (!historyValid) this.#readIndex = 0;\n'
              '    this.#frameSignature = candidate;\n',
          )

          replace_once(
              'packages/renderer/src/static-accumulation-gpu-history.ts',
              '    const historyValid = this.#history.isReusable(candidate);\n'
              '    this.#frameSignature = candidate;\n'
              '    const writeIndex = this.#readIndex === 0 ? 1 : 0;\n',
              '    const historyValid = this.#history.isReusable(candidate);\n'
              '    if (!historyValid) this.#readIndex = 0;\n'
              '    this.#frameSignature = candidate;\n'
              '    const writeIndex = this.#readIndex === 0 ? 1 : 0;\n',
          )

          dynamic_anchor = "  it('atomically resizes, invalidates Viewport history, and disposes without owning Backend', async () => {"
          dynamic_test = dedent("""\
            it('restores canonical ping-pong roles after signature mismatch', async () => {
              const backend = new MockBackend();
              await backend.initialize();
              const history = new DynamicTaaGpuHistory({
                height: 1,
                ownerId: 'dynamic-signature-role-reset',
                width: 1,
              });
              history.initialize(backend);

              const first = history.prepareFrame(signature());
              history.commitFrame();
              const changed = history.prepareFrame(signature({ materials: 2 }));
              expect(changed.historyValid).toBe(false);
              expect(changed.readColorTexture).toBe(first.readColorTexture);
              expect(changed.readDepthTexture).toBe(first.readDepthTexture);
              expect(changed.readNormalTexture).toBe(first.readNormalTexture);
              expect(changed.writeColorTexture).toBe(first.writeColorTexture);
              expect(changed.writeDepthTexture).toBe(first.writeDepthTexture);
              expect(changed.writeNormalTexture).toBe(first.writeNormalTexture);
              expect(history.commitFrame()).toMatchObject({
                history: {
                  generation: 1,
                  lastInvalidation: 'signature-mismatch',
                  sampleCount: 1,
                  valid: true,
                },
              });

              history.dispose();
              expect(backend.getResourceStatistics().activeCount).toBe(0);
              backend.dispose();
            });

          """)
          replace_once(
              'packages/renderer/test/dynamic-taa-gpu-history.test.ts',
              dynamic_anchor,
              dynamic_test + dynamic_anchor,
          )

          replace_once(
              'packages/renderer/test/static-accumulation-gpu-history.test.ts',
              "    expect(changed).toMatchObject({ historyValid: false, previousSampleCount: 0 });\n"
              "    expect(history.commitFrame()).toMatchObject({\n",
              "    expect(changed).toMatchObject({ historyValid: false, previousSampleCount: 0 });\n"
              "    expect(changed.readColorTexture).toBe(first.readColorTexture);\n"
              "    expect(changed.writeColorTexture).toBe(first.writeColorTexture);\n"
              "    expect(history.commitFrame()).toMatchObject({\n",
          )

          pipeline_anchor = "  it('reuses the same Bind Groups across repeated History resets', async () => {"
          pipeline_test = dedent("""\
            it('reuses canonical Bind Groups when History becomes non-reusable by signature only', async () => {
              const backend = new MockBackend();
              await backend.initialize();
              const transaction = createTransaction();
              await transaction.initialize(backend);

              transaction.execute({
                currentInverseViewProjection: identityMat4(),
                dirtyFlags: [],
                previousViewProjection: identityMat4(),
                renderCurrent: () => currentStatistics,
                signature,
                temporal: temporal('interactive', 0),
              });
              transaction.execute({
                currentInverseViewProjection: identityMat4(),
                dirtyFlags: [],
                previousViewProjection: identityMat4(),
                renderCurrent: () => currentStatistics,
                signature,
                temporal: temporal('accumulating', 1),
              });

              const baseline = backend.getResourceStatistics();
              expect(transaction.getDiagnostics()).toMatchObject({
                resolve: { activeBindGroupCount: 2 },
                staticPass: { activeBindGroupCount: 1 },
              });

              const changedSignature = { ...signature, postProcess: 2 };
              transaction.execute({
                currentInverseViewProjection: identityMat4(),
                dirtyFlags: [],
                previousViewProjection: identityMat4(),
                renderCurrent: () => currentStatistics,
                signature: changedSignature,
                temporal: temporal('interactive', 0),
              });
              transaction.execute({
                currentInverseViewProjection: identityMat4(),
                dirtyFlags: [],
                previousViewProjection: identityMat4(),
                renderCurrent: () => currentStatistics,
                signature: changedSignature,
                temporal: temporal('accumulating', 1),
              });

              expect(backend.getResourceStatistics().activeCount).toBe(baseline.activeCount);
              expect(transaction.getDiagnostics()).toMatchObject({
                resolve: { activeBindGroupCount: 2 },
                staticPass: { activeBindGroupCount: 1 },
              });

              transaction.dispose();
              expect(backend.getResourceStatistics().activeCount).toBe(0);
              backend.dispose();
            });

          """)
          replace_once(
              'packages/renderer/test/temporal-pipeline-transaction.test.ts',
              pipeline_anchor,
              pipeline_test + pipeline_anchor,
          )

          replace_once(
              'tests/e2e/online-pages.spec.ts',
              "  await expect(page.getByTestId('render-mode')).toHaveText('sleeping');\n\n"
              "  if (phase > 0) {\n",
              "  await expect(page.getByTestId('render-mode')).toHaveText('sleeping', {\n"
              "    timeout: phase === 4 ? 60_000 : 10_000,\n"
              "  });\n\n"
              "  if (phase > 0) {\n",
          )
          PY

          pnpm exec prettier \
            packages/renderer/src/dynamic-taa-gpu-history.ts \
            packages/renderer/src/static-accumulation-gpu-history.ts \
            packages/renderer/test/dynamic-taa-gpu-history.test.ts \
            packages/renderer/test/static-accumulation-gpu-history.test.ts \
            packages/renderer/test/temporal-pipeline-transaction.test.ts \
            tests/e2e/online-pages.spec.ts \
            --write

      - name: Build packages for focused regressions
        run: pnpm build

      - name: Run focused History and transaction regressions
        run: |
          pnpm exec vitest run \
            packages/renderer/test/dynamic-taa-gpu-history.test.ts \
            packages/renderer/test/static-accumulation-gpu-history.test.ts \
            packages/renderer/test/temporal-pipeline-transaction.test.ts

      - name: Run complete verification pipeline
        run: pnpm verify

      - name: Commit verified repair and remove temporary workflows
        run: |
          rm .github/workflows/phase-04-non-reusable-history-repair.yml
          rm .github/workflows/phase-04-non-reusable-history-repair-v2.yml
          rm .github/workflows/phase-04-repair-failure-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase-04): canonicalize non-reusable History roles"
          git push origin HEAD:phase-04-non-reusable-history-roles
