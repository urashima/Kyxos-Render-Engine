name: Phase 4 post-handoff verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-post-handoff-verify.yml

permissions:
  contents: read

jobs:
  verify-final-pages:
    name: Verify final public Pages after CDN propagation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FINAL_MAIN_SHA: 9ff598bd680dc01553abffb19e59045d7036eb31
      PHASE_URL: https://urashima.github.io/Kyxos-Render-Engine/phase-4/
      LATEST_URL: https://urashima.github.io/Kyxos-Render-Engine/latest/
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for final public routes
        run: |
          cat > /tmp/verify-final-pages.mjs <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';

          const expectedCommit = process.env.FINAL_MAIN_SHA;
          const expectedControls = [
            'jitterScale',
            'baseHistoryWeight',
            'depthAbsoluteThreshold',
            'depthRelativeThreshold',
            'edgeDepthDifference',
            'maxVelocityLength',
            'minimumCurrentWeight',
            'varianceClipGamma',
            'subpixelCorrection',
            'flickerReduction',
            'normalRejectionCosine',
            'responsiveHistoryReduction',
            'responsiveMask',
          ];
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--enable-unsafe-webgpu',
              '--enable-features=Vulkan,UseSkiaRenderer',
              '--use-angle=swiftshader',
              '--disable-vulkan-surface',
            ],
          });
          const attempts = [];
          const deadline = Date.now() + 10 * 60 * 1000;
          let acceptedEvidence;
          try {
            while (Date.now() < deadline && acceptedEvidence === undefined) {
              const evidence = {};
              let valid = true;
              for (const [name, baseUrl] of [
                ['phase-4', process.env.PHASE_URL],
                ['latest', process.env.LATEST_URL],
              ]) {
                const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
                try {
                  await page.goto(`${baseUrl}?posthandoff=${expectedCommit}&attempt=${attempts.length}&t=${Date.now()}`, {
                    waitUntil: 'domcontentloaded',
                    timeout: 120000,
                  });
                  await page.locator('[data-testid="commit-sha"]').waitFor({ timeout: 120000 });
                  const commit = (await page.locator('[data-testid="commit-sha"]').textContent())?.trim();
                  const controls = await page.locator('[data-taa-control]').evaluateAll((nodes) =>
                    [...new Set(nodes.map((node) => node.getAttribute('data-taa-control')).filter(Boolean))],
                  );
                  const missing = expectedControls.filter((control) => !controls.includes(control));
                  evidence[name] = { commit, controlCount: controls.length, controls, missing };
                  if (commit !== expectedCommit || missing.length > 0 || controls.length !== expectedControls.length) {
                    valid = false;
                  }
                } catch (error) {
                  evidence[name] = { error: error instanceof Error ? error.message : String(error) };
                  valid = false;
                } finally {
                  await page.close();
                }
              }
              attempts.push({ checkedAt: new Date().toISOString(), evidence });
              console.log(JSON.stringify(attempts.at(-1), null, 2));
              if (valid) {
                acceptedEvidence = evidence;
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
          } finally {
            await browser.close();
          }
          await writeFile('/tmp/final-public-attempts.json', `${JSON.stringify(attempts, null, 2)}\n`);
          if (acceptedEvidence === undefined) {
            throw new Error(`Pages CDN did not expose ${expectedCommit} with 13 controls before timeout`);
          }
          await writeFile('/tmp/final-public-evidence.json', `${JSON.stringify(acceptedEvidence, null, 2)}\n`);
          JS
          node /tmp/verify-final-pages.mjs

      - name: Upload final public evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-final-public-evidence
          path: |
            /tmp/final-public-attempts.json
            /tmp/final-public-evidence.json
          if-no-files-found: error
