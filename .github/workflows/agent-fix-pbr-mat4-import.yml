name: Fix PBR temporal matrix import

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/agent-fix-pbr-mat4-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 2
          persist-credentials: true
      - name: Insert Mat4 type import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/renderer/src/pbr-render-feature.ts')
          source = path.read_text()
          marker = "import type { EntityHandle, Scene } from '@kyxos/render-scene';"
          import_line = "import type { Mat4 } from '@kyxos/render-math';\n"
          if import_line not in source:
              if marker not in source:
                  raise SystemExit('PBR Mat4 import marker not found')
              source = source.replace(marker, import_line + marker)
          path.write_text(source)
          PY
      - name: Commit import fix
        run: |
          git rm .github/workflows/agent-fix-pbr-mat4-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/renderer/src/pbr-render-feature.ts
          git commit -m 'fix(temporal): import PBR matrix contract'
          git push origin HEAD:agent/phase-04-temporal
