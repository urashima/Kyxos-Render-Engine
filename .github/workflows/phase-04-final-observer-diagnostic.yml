name: Phase 4 final observer diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-final-observer-diagnostic.yml

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: e9ba237744dc33253a40dd05dc47ded15fb586d9
    steps:
      - name: Capture observer failure and exact run state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 30141616643 --repo "${GITHUB_REPOSITORY}" --log-failed > /tmp/observer-failure.log
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100" > /tmp/runs.json
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/deployments?sha=${TARGET_SHA}&per_page=100" > /tmp/deployments.json
          jq '{total_count,workflow_runs:[.workflow_runs[]|{id,name,event,status,conclusion,head_sha,created_at,updated_at}]}' /tmp/runs.json > /tmp/run-summary.json
          tail -n 200 /tmp/observer-failure.log
          cat /tmp/run-summary.json

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-final-observer-diagnostic
          path: |
            /tmp/observer-failure.log
            /tmp/run-summary.json
            /tmp/deployments.json
