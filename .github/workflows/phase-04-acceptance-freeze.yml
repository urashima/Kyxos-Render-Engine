name: Freeze Phase 4 accepted source

on:
  push:
    branches:
      - agent/phase-04-acceptance-freeze
  pull_request:
    branches:
      - main

concurrency:
  group: phase-04-acceptance-freeze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  freeze:
    name: Reverify exact deployment and freeze immutable tag
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPECTED_COMMIT_SHA: a1b004d4e7862873c653478af528201a898f906b
      PAGES_LATEST_PHASE: '4'
      PAGES_PHASES: 0,1,2,3,4
      PUBLIC_PLAYGROUND_URL: https://urashima.github.io/Kyxos-Render-Engine/

    steps:
      - name: Check out freeze branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-acceptance-freeze
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Reverify exact accepted deployment source
        run: pnpm exec playwright test --config playwright.pages.config.ts

      - name: Freeze immutable accepted tag
        shell: bash
        run: |
          git fetch --tags origin
          if git show-ref --verify --quiet refs/tags/phase-04-accepted; then
            existing_target="$(git rev-list -n 1 refs/tags/phase-04-accepted)"
            if [ "$existing_target" != "$EXPECTED_COMMIT_SHA" ]; then
              echo "phase-04-accepted already targets ${existing_target}, expected ${EXPECTED_COMMIT_SHA}." >&2
              exit 1
            fi
            echo "phase-04-accepted already targets the exact accepted source."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate phase-04-accepted "$EXPECTED_COMMIT_SHA" \
            --message 'Phase 4 accepted: scheduler, Dynamic TAA, static accumulation, exact public WebGPU verification'
          git push origin refs/tags/phase-04-accepted

      - name: Write acceptance-freeze evidence
        shell: bash
        run: |
          mkdir -p test-results/phase-04/public
          cat > test-results/phase-04/public/acceptance-freeze.json <<EOF
          {
            "schemaVersion": 1,
            "phase": "04",
            "status": "PASS",
            "acceptedSource": "${EXPECTED_COMMIT_SHA}",
            "acceptedTag": "phase-04-accepted",
            "latestPhase": 4,
            "phases": [0, 1, 2, 3, 4],
            "publicUrl": "${PUBLIC_PLAYGROUND_URL}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowJob": "Reverify exact deployment and freeze immutable tag"
          }
          EOF

      - name: Upload acceptance-freeze evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-acceptance-freeze-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/phase-04/public/
            test-results/pages/
          if-no-files-found: ignore
          retention-days: 7
