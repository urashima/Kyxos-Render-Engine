name: Export Phase 4 Pages failure log

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_JOB_ID: '89267669620'
    steps:
      - name: Download complete failed public verification log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-failure
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            > pages-failure/public-verification.log
          tail -n 250 pages-failure/public-verification.log

      - name: Upload complete failure log
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-pages-public-failure-log
          path: pages-failure/public-verification.log
          retention-days: 7
