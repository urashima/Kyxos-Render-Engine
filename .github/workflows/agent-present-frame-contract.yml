name: Generalize temporal Present frame contract

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/agent-present-frame-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply minimum Present frame contract
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'packages/renderer/src/dynamic-taa-present-pass.ts';
          let source = await readFile(path, 'utf8');
          source = source.replace(
            '  BackendSurfaceResize,\n  GraphicsBackend,',
            '  BackendSurfaceResize,\n  BackendTextureHandle,\n  GraphicsBackend,',
          );
          source = source.replace(
            "import type { DynamicTaaGpuFrame } from './dynamic-taa-gpu-history.js';\n",
            '',
          );
          source = source.replace(
            'export interface DynamicTaaPresentPassInput {\n  /** Resolved Color is read from the open frame\'s write target before History commit. */\n  readonly frame: DynamicTaaGpuFrame;\n}\n',
            "export interface TemporalPresentColorFrame {\n  readonly ownerId: string;\n  readonly resourceGeneration: number;\n  readonly size: { readonly height: number; readonly width: number };\n  readonly writeColorTexture: BackendTextureHandle;\n}\n\nexport interface DynamicTaaPresentPassInput {\n  /** Linear-HDR Color is read from the open frame's write target before History commit. */\n  readonly frame: TemporalPresentColorFrame;\n}\n",
          );
          source = source.replace(
            '    frame: DynamicTaaGpuFrame,\n',
            '    frame: TemporalPresentColorFrame,\n',
          );
          await writeFile(path, source);

          const indexPath = 'packages/renderer/src/index.ts';
          let index = await readFile(indexPath, 'utf8');
          index = index.replace(
            '  type DynamicTaaPresentPassOptions,\n',
            '  type DynamicTaaPresentPassOptions,\n  type TemporalPresentColorFrame,\n',
          );
          await writeFile(indexPath, index);
          NODE
          pnpm exec prettier --write packages/renderer/src/dynamic-taa-present-pass.ts packages/renderer/src/index.ts
      - name: Commit Present contract
        run: |
          git rm .github/workflows/agent-present-frame-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/renderer/src/dynamic-taa-present-pass.ts packages/renderer/src/index.ts
          git commit -m 'refactor(temporal): generalize Present color frame'
          git push origin HEAD:agent/phase-04-temporal
