name: Align P4-10 CPU API calls

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/agent-fix-p4-10-api.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply public CPU contract names
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const sdkPath = 'packages/sdk/test/static-accumulation-consumer.test.ts';
          let sdk = await readFile(sdkPath, 'utf8');
          sdk = sdk
            .replace('historyColor: [0, 0, 0, 0],', 'accumulatedColor: [0, 0, 0, 0],')
            .replace('previousSampleCount: 0,', 'accumulatedSampleCount: 0,');
          await writeFile(sdkPath, sdk);

          const e2ePath = 'tests/e2e/phase-04-static-accumulation-runtime.spec.ts';
          let e2e = await readFile(e2ePath, 'utf8');
          e2e = e2e
            .replace('historyColor: [0, 0, 0, 0],', 'accumulatedColor: [0, 0, 0, 0],')
            .replace('previousSampleCount: 0,\n    });', 'accumulatedSampleCount: 0,\n    });')
            .replace('historyColor: cpu.outputColor,', 'accumulatedColor: cpu.outputColor,')
            .replace('previousSampleCount: cpu.sampleCount,', 'accumulatedSampleCount: cpu.sampleCount,');
          await writeFile(e2ePath, e2e);
          NODE
          pnpm exec prettier --write packages/sdk/test/static-accumulation-consumer.test.ts tests/e2e/phase-04-static-accumulation-runtime.spec.ts
      - name: Commit contract fix
        run: |
          git rm .github/workflows/agent-fix-p4-10-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/sdk/test/static-accumulation-consumer.test.ts tests/e2e/phase-04-static-accumulation-runtime.spec.ts
          git commit -m 'fix(temporal): align static accumulation CPU inputs'
          git push origin HEAD:agent/phase-04-temporal
