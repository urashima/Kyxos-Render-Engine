name: Phase 4 format work status

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-format-work-status.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: phase-04-non-reusable-history-roles
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format status and commit
        run: |
          pnpm exec prettier WORK_STATUS.md --write
          rm .github/workflows/phase-04-format-work-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(phase-04): format repair status"
          git push origin HEAD:phase-04-non-reusable-history-roles
