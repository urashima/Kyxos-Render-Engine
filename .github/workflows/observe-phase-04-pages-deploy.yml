name: Observe Phase 4 Pages Deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/observe-phase-04-pages-deploy.yml

permissions:
  actions: read
  contents: read

jobs:
  observe:
    name: Wait for blocking Main Pages workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Find and wait for blocking deployment run
        uses: actions/github-script@v7
        with:
          script: |
            const blockingSha = '7596a09b47ceb41a67a1073387b43b5014115603';
            let run;
            for (let attempt = 0; attempt < 20 && !run; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy-pages.yml',
                per_page: 30,
              });
              for (const candidate of response.data.workflow_runs) {
                core.info(`candidate id=${candidate.id} event=${candidate.event} status=${candidate.status} conclusion=${candidate.conclusion} head=${candidate.head_sha}`);
              }
              run = response.data.workflow_runs.find((candidate) => candidate.head_sha === blockingSha);
              if (!run) await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            if (!run) throw new Error(`No deploy-pages.yml run found for ${blockingSha}.`);

            core.info(`blocking run id=${run.id} url=${run.html_url}`);
            for (let attempt = 0; attempt < 80 && run.status !== 'completed'; attempt += 1) {
              await new Promise((resolve) => setTimeout(resolve, 15000));
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              run = response.data;
              core.info(`blocking run status=${run.status} conclusion=${run.conclusion}`);
            }
            if (run.status !== 'completed') throw new Error(`Blocking run ${run.id} did not finish.`);
            core.info(`BLOCKING_RUN_ID=${run.id}`);
            core.info(`BLOCKING_RUN_CONCLUSION=${run.conclusion}`);
