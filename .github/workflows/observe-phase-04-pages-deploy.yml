name: Observe Phase 4 Pages Deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/observe-phase-04-pages-deploy.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    name: Wait for dispatched Main Pages workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Find, wait, and report deployment run
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 20 * 60 * 1000;
            let run;
            for (let attempt = 0; attempt < 20 && !run; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy-pages.yml',
                event: 'workflow_dispatch',
                per_page: 20,
              });
              run = response.data.workflow_runs.find((candidate) =>
                new Date(candidate.created_at).getTime() >= cutoff,
              );
              if (!run) await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            if (!run) throw new Error('No recent deploy-pages.yml workflow_dispatch run was found.');

            for (let attempt = 0; attempt < 80 && run.status !== 'completed'; attempt += 1) {
              await new Promise((resolve) => setTimeout(resolve, 15000));
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              run = response.data;
            }
            if (run.status !== 'completed') throw new Error(`Deployment run ${run.id} did not finish.`);

            const icon = run.conclusion === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 34,
              body: `${icon} Observed Main Pages deployment Run \`${run.id}\`: **${run.conclusion}**\n\n${run.html_url}`,
            });
            if (run.conclusion !== 'success') {
              core.setFailed(`Main Pages deployment Run ${run.id} concluded ${run.conclusion}.`);
            }
