name: Observe Phase 4 Pages Deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/observe-phase-04-pages-deploy.yml

permissions:
  actions: read
  contents: read

jobs:
  observe:
    name: Wait for Main reset and Pages deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Find and wait for reset and deploy runs
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 20 * 60 * 1000;
            async function latestRecent(workflowId) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                event: 'workflow_dispatch',
                per_page: 20,
              });
              return response.data.workflow_runs.find((run) => new Date(run.created_at).getTime() >= cutoff);
            }
            async function waitForRun(workflowId, notBefore = 0) {
              let run;
              for (let attempt = 0; attempt < 40 && !run; attempt += 1) {
                const candidate = await latestRecent(workflowId);
                if (candidate && new Date(candidate.created_at).getTime() >= notBefore) run = candidate;
                if (!run) await new Promise((resolve) => setTimeout(resolve, 15000));
              }
              if (!run) throw new Error(`No recent ${workflowId} run found.`);
              core.info(`${workflowId} run id=${run.id} url=${run.html_url}`);
              for (let attempt = 0; attempt < 100 && run.status !== 'completed'; attempt += 1) {
                await new Promise((resolve) => setTimeout(resolve, 15000));
                const response = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                run = response.data;
                core.info(`${workflowId} status=${run.status} conclusion=${run.conclusion}`);
              }
              if (run.status !== 'completed') throw new Error(`${workflowId} run ${run.id} did not finish.`);
              return run;
            }

            const reset = await waitForRun('reset-and-deploy-phase-04-preview.yml');
            core.info(`RESET_RUN_ID=${reset.id}`);
            core.info(`RESET_RUN_CONCLUSION=${reset.conclusion}`);
            if (reset.conclusion !== 'success') throw new Error(`Reset run ${reset.id} failed.`);

            const deploy = await waitForRun('deploy-pages.yml', new Date(reset.created_at).getTime());
            core.info(`DEPLOY_RUN_ID=${deploy.id}`);
            core.info(`DEPLOY_RUN_CONCLUSION=${deploy.conclusion}`);
            core.info(`DEPLOY_RUN_URL=${deploy.html_url}`);
            if (deploy.conclusion !== 'success') throw new Error(`Deploy run ${deploy.id} failed.`);
