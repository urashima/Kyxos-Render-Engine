name: Phase 4 non-reusable History repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-non-reusable-history-repair.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: true
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: phase-04-non-reusable-history-roles
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply canonical non-reusable History roles and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'packages/renderer/src/dynamic-taa-gpu-history.ts',
              """    const candidate = createTemporalHistorySignature(signature);
              const historyValid = this.#history.isReusable(candidate);
              this.#frameSignature = candidate;
          """,
              """    const candidate = createTemporalHistorySignature(signature);
              const historyValid = this.#history.isReusable(candidate);
              if (!historyValid) this.#readIndex = 0;
              this.#frameSignature = candidate;
          """,
          )

          replace_once(
              'packages/renderer/src/static-accumulation-gpu-history.ts',
              """    const historyValid = this.#history.isReusable(candidate);
              this.#frameSignature = candidate;
              const writeIndex = this.#readIndex === 0 ? 1 : 0;
          """,
              """    const historyValid = this.#history.isReusable(candidate);
              if (!historyValid) this.#readIndex = 0;
              this.#frameSignature = candidate;
              const writeIndex = this.#readIndex === 0 ? 1 : 0;
          """,
          )

          replace_once(
              'packages/renderer/test/dynamic-taa-gpu-history.test.ts',
              """    history.invalidate('post-process');
              const reset = history.prepareFrame(signature({ postProcess: 2 }));
              expect(reset.historyValid).toBe(false);
              expect(reset.readColorTexture).toBe(first.readColorTexture);
              expect(reset.readDepthTexture).toBe(first.readDepthTexture);
              expect(reset.readNormalTexture).toBe(first.readNormalTexture);
              expect(reset.writeColorTexture).toBe(first.writeColorTexture);
              expect(reset.writeDepthTexture).toBe(first.writeDepthTexture);
              expect(reset.writeNormalTexture).toBe(first.writeNormalTexture);
              history.cancelFrame();

              const changed = history.prepareFrame(signature({ materials: 2 }));
              expect(changed.historyValid).toBe(false);
              expect(history.commitFrame()).toMatchObject({
                history: {
                  generation: 1,
                  lastInvalidation: 'post-process',
                  sampleCount: 1,
                  valid: true,
                },
              });
          """,
              """    const changed = history.prepareFrame(signature({ materials: 2 }));
              expect(changed.historyValid).toBe(false);
              expect(changed.readColorTexture).toBe(first.readColorTexture);
              expect(changed.readDepthTexture).toBe(first.readDepthTexture);
              expect(changed.readNormalTexture).toBe(first.readNormalTexture);
              expect(changed.writeColorTexture).toBe(first.writeColorTexture);
              expect(changed.writeDepthTexture).toBe(first.writeDepthTexture);
              expect(changed.writeNormalTexture).toBe(first.writeNormalTexture);
              expect(history.commitFrame()).toMatchObject({
                history: {
                  generation: 1,
                  lastInvalidation: 'signature-mismatch',
                  sampleCount: 1,
                  valid: true,
                },
              });

              history.invalidate('post-process');
              const reset = history.prepareFrame(signature({ materials: 2, postProcess: 2 }));
              expect(reset.historyValid).toBe(false);
              expect(reset.readColorTexture).toBe(first.readColorTexture);
              expect(reset.readDepthTexture).toBe(first.readDepthTexture);
              expect(reset.readNormalTexture).toBe(first.readNormalTexture);
              expect(reset.writeColorTexture).toBe(first.writeColorTexture);
              expect(reset.writeDepthTexture).toBe(first.writeDepthTexture);
              expect(reset.writeNormalTexture).toBe(first.writeNormalTexture);
              history.cancelFrame();
          """,
          )

          replace_once(
              'packages/renderer/test/static-accumulation-gpu-history.test.ts',
              """    const changed = history.prepareFrame(signature({ materials: 2 }));
              expect(changed).toMatchObject({ historyValid: false, previousSampleCount: 0 });
              expect(history.commitFrame()).toMatchObject({
          """,
              """    const changed = history.prepareFrame(signature({ materials: 2 }));
              expect(changed).toMatchObject({ historyValid: false, previousSampleCount: 0 });
              expect(changed.readColorTexture).toBe(first.readColorTexture);
              expect(changed.writeColorTexture).toBe(first.writeColorTexture);
              expect(history.commitFrame()).toMatchObject({
          """,
          )

          replace_once(
              'packages/renderer/test/temporal-pipeline-transaction.test.ts',
              """  it('reuses the same Bind Groups across repeated History resets', async () => {
                const backend = new MockBackend();
                await backend.initialize();
                const transaction = createTransaction();
                await transaction.initialize(backend);

                const executeCycle = (generation: number): void => {
                  const cycleSignature = { ...signature, postProcess: generation };
                  transaction.execute({
                    currentInverseViewProjection: identityMat4(),
                    dirtyFlags: ['post-process'],
                    previousViewProjection: identityMat4(),
                    renderCurrent: () => currentStatistics,
                    signature: cycleSignature,
                    temporal: temporal('interactive', 0, generation, true),
                  });
                  transaction.execute({
                    currentInverseViewProjection: identityMat4(),
                    dirtyFlags: [],
                    previousViewProjection: identityMat4(),
                    renderCurrent: () => currentStatistics,
                    signature: cycleSignature,
                    temporal: temporal('accumulating', 1, generation),
                  });
                  transaction.execute({
                    currentInverseViewProjection: identityMat4(),
                    dirtyFlags: [],
                    previousViewProjection: identityMat4(),
                    renderCurrent: () => currentStatistics,
                    signature: cycleSignature,
                    temporal: temporal('accumulating', 2, generation),
                  });
                };

                executeCycle(1);
                const baseline = backend.getResourceStatistics();
                expect(transaction.getDiagnostics().staticPass.activeBindGroupCount).toBe(2);

                executeCycle(2);
                expect(backend.getResourceStatistics().activeCount).toBe(baseline.activeCount);
                expect(transaction.getDiagnostics()).toMatchObject({
                  resolve: { activeBindGroupCount: 2 },
                  staticPass: { activeBindGroupCount: 2 },
                });

                executeCycle(3);
                expect(backend.getResourceStatistics().activeCount).toBe(baseline.activeCount);
                expect(transaction.getDiagnostics()).toMatchObject({
                  resolve: { activeBindGroupCount: 2 },
                  staticPass: { activeBindGroupCount: 2 },
                });

                transaction.dispose();
                expect(backend.getResourceStatistics().activeCount).toBe(0);
                backend.dispose();
              });
          """,
              """  it('reuses canonical Bind Groups when History becomes non-reusable by signature only', async () => {
                const backend = new MockBackend();
                await backend.initialize();
                const transaction = createTransaction();
                await transaction.initialize(backend);

                transaction.execute({
                  currentInverseViewProjection: identityMat4(),
                  dirtyFlags: [],
                  previousViewProjection: identityMat4(),
                  renderCurrent: () => currentStatistics,
                  signature,
                  temporal: temporal('interactive', 0),
                });
                transaction.execute({
                  currentInverseViewProjection: identityMat4(),
                  dirtyFlags: [],
                  previousViewProjection: identityMat4(),
                  renderCurrent: () => currentStatistics,
                  signature,
                  temporal: temporal('accumulating', 1),
                });

                const baseline = backend.getResourceStatistics();
                expect(transaction.getDiagnostics()).toMatchObject({
                  resolve: { activeBindGroupCount: 2 },
                  staticPass: { activeBindGroupCount: 1 },
                });

                const changedSignature = { ...signature, postProcess: 2 };
                transaction.execute({
                  currentInverseViewProjection: identityMat4(),
                  dirtyFlags: [],
                  previousViewProjection: identityMat4(),
                  renderCurrent: () => currentStatistics,
                  signature: changedSignature,
                  temporal: temporal('interactive', 0),
                });
                transaction.execute({
                  currentInverseViewProjection: identityMat4(),
                  dirtyFlags: [],
                  previousViewProjection: identityMat4(),
                  renderCurrent: () => currentStatistics,
                  signature: changedSignature,
                  temporal: temporal('accumulating', 1),
                });

                expect(backend.getResourceStatistics().activeCount).toBe(baseline.activeCount);
                expect(transaction.getDiagnostics()).toMatchObject({
                  resolve: { activeBindGroupCount: 2 },
                  staticPass: { activeBindGroupCount: 1 },
                });

                transaction.dispose();
                expect(backend.getResourceStatistics().activeCount).toBe(0);
                backend.dispose();
              });
          """,
          )

          replace_once(
              'tests/e2e/online-pages.spec.ts',
              """  await expect(page.getByTestId('render-mode')).toHaveText('sleeping');

              if (phase > 0) {
          """,
              """  await expect(page.getByTestId('render-mode')).toHaveText('sleeping', {
                timeout: phase === 4 ? 60_000 : 10_000,
              });

              if (phase > 0) {
          """,
          )
          PY

          pnpm exec prettier \
            packages/renderer/src/dynamic-taa-gpu-history.ts \
            packages/renderer/src/static-accumulation-gpu-history.ts \
            packages/renderer/test/dynamic-taa-gpu-history.test.ts \
            packages/renderer/test/static-accumulation-gpu-history.test.ts \
            packages/renderer/test/temporal-pipeline-transaction.test.ts \
            tests/e2e/online-pages.spec.ts \
            --write

      - name: Run focused History and transaction regressions
        run: |
          pnpm exec vitest run \
            packages/renderer/test/dynamic-taa-gpu-history.test.ts \
            packages/renderer/test/static-accumulation-gpu-history.test.ts \
            packages/renderer/test/temporal-pipeline-transaction.test.ts

      - name: Run complete verification pipeline
        run: pnpm verify

      - name: Commit verified repair and remove executor
        run: |
          rm .github/workflows/phase-04-non-reusable-history-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase-04): canonicalize non-reusable History roles"
          git push origin HEAD:phase-04-non-reusable-history-roles
