name: Phase 4 resource stability finalization

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-resource-stability-finalize.yml
      - .github/scripts/finalize-phase-04-resource-stability.py

permissions:
  contents: write

jobs:
  apply-canonical-history-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: phase-04-resource-stability-finalize
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply canonical non-reusable History roles
        run: python .github/scripts/finalize-phase-04-resource-stability.py

      - name: Format exact repair scope
        run: |
          pnpm exec prettier \
            packages/renderer/src/dynamic-taa-gpu-history.ts \
            packages/renderer/src/static-accumulation-gpu-history.ts \
            packages/renderer/test/dynamic-taa-gpu-history.test.ts \
            packages/renderer/test/static-accumulation-gpu-history.test.ts \
            --write

      - name: Run focused History and pipeline regressions
        run: |
          pnpm exec vitest run \
            packages/renderer/test/dynamic-taa-gpu-history.test.ts \
            packages/renderer/test/static-accumulation-gpu-history.test.ts \
            packages/renderer/test/temporal-pipeline-transaction.test.ts

      - name: Commit tested repair and remove temporary maintenance files
        run: |
          rm .github/workflows/phase-04-resource-stability-finalize.yml
          rm .github/scripts/finalize-phase-04-resource-stability.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase-04): canonicalize every non-reusable History role"
          git push origin HEAD:phase-04-resource-stability-finalize
