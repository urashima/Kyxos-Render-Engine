name: Phase 4 Deferred Lighting checkpoint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-deferred-lighting-checkpoint.yml
  push:
    branches:
      - agent/phase-04-deferred-traa-rebuild
    paths:
      - .github/workflows/phase-04-deferred-lighting-checkpoint.yml

permissions:
  contents: write

jobs:
  verify-and-record:
    name: Format and verify Deferred Lighting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-deferred-traa-rebuild

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply Resize cleanup type fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/renderer/src/deferred-lighting-pass.ts')
          source = path.read_text(encoding='utf-8')
          start_marker = '      const cleanupErrors = this.#destroyHandles('
          end_marker = '      if (cleanupErrors.length === 1)'
          start = source.index(start_marker, source.index('  resize('))
          end = source.index(end_marker, start)
          replacement = '''      const cleanupHandles: BackendResourceHandle[] = [];
                if (previousBindGroup !== undefined) cleanupHandles.push(previousBindGroup);
                if (previousColor !== undefined) cleanupHandles.push(previousColor);
                const cleanupErrors = this.#destroyHandles(backend, cleanupHandles);
          '''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

      - name: Format exact Deferred Lighting files
        run: |
          pnpm exec prettier --write \
            packages/renderer/src/deferred-lighting-pass.ts \
            packages/renderer/src/generated/phase-04-deferred-lighting.wgsl.ts \
            packages/renderer/src/index.ts \
            packages/renderer/test/deferred-lighting-pass.test.ts \
            tools/shader-build/validate-shaders.mjs \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md

      - name: Run focused compile and lifecycle gates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          {
            pnpm typecheck
            pnpm test:unit
            pnpm validate:shaders
          } 2>&1 | tee test-results/phase-04/runtime/deferred-lighting-focused.log

      - name: Run complete verification
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/deferred-lighting-checkpoint.log

      - name: Commit verified Deferred Lighting checkpoint
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            shaders/webgpu/phase-04-deferred-lighting.wgsl \
            packages/renderer/src/deferred-lighting-pass.ts \
            packages/renderer/src/generated/phase-04-deferred-lighting.wgsl.ts \
            packages/renderer/src/index.ts \
            packages/renderer/test/deferred-lighting-pass.test.ts \
            tools/shader-build/validate-shaders.mjs \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(phase-04): add independent Deferred Lighting pass"
          git push origin HEAD:agent/phase-04-deferred-traa-rebuild

      - name: Upload verification log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: deferred-lighting-checkpoint-${{ github.run_attempt }}
          path: test-results/phase-04/runtime/
          if-no-files-found: ignore
          retention-days: 7
