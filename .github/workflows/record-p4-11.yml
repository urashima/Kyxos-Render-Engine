name: Record P4-11 evidence

on:
  push:
    branches:
      - agent/phase-04-temporal
    paths:
      - .github/workflows/record-p4-11.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase-04-temporal
          fetch-depth: 0
      - name: Record verified checkpoint
        env:
          VERIFIED_SHA: 9e173a8644f5187934b3343d0991741b2c9afca5
        run: |
          python <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import os

          verified = os.environ['VERIFIED_SHA']
          timestamp = datetime.now(ZoneInfo('America/Los_Angeles')).strftime('%Y-%m-%d %H:%M PDT')

          work_log = Path('docs/execution/WORK_LOG.md')
          marker = 'P4-11 Scheduler-driven single-Surface Temporal PBR pipeline passed'
          if marker not in work_log.read_text():
              entry = f'''\n\n## {timestamp} — {marker}\n\n### Completed\n\n- Added `TemporalPipelineTransaction` with the fixed order PBR MRT → Dynamic TAA Resolve → optional Static Accumulation → final Present → atomic Dynamic/Static History commit. Any failed stage cancels every open History frame.\n- Added `TemporalPbrRenderFeature`, which composes Scheduler metadata, Halton Camera jitter, the PBR temporal MRT path, Dynamic Resolve, Static Accumulation, and final display output behind one Render Feature.\n- Kept the accepted Phase 3 direct-Surface PBR mode unchanged and made temporal output opt-in. Temporal PBR borrows the Present-owned Surface contract so one Canvas has exactly one Surface owner.\n- Added borrowed Surface Resize, jittered View-Projection injection, complete Dirty reset propagation, Static convergence reporting, Device Lost detachment/recovery, exact disposal, and public `@kyxos/render-sdk/temporal-pbr` exposure.\n- Added MockBackend transaction/unit coverage plus a pinned Chromium/SwiftShader gate driven by the real `TemporalFrameScheduler`.\n\n### Validation\n\n- Verified checkpoint Head `{verified}` passed Run `29978597536`, job `89115544133`: formatting, zero-warning Lint, strict TypeScript, package/architecture boundaries, frozen Phase 0–3 Schemas, fourteen exact Shader mirrors, build, Bundle, Pages, unit tests, and all 32 pinned Chromium/WebGPU cases.\n- Artifact `8552401380`, digest `sha256:0caa60b3f06f0a73b694743679e2ca0ba347895234cd15233d0aa263c8bbce58`, contains the complete browser diagnostics including `test-results/phase-04/runtime/pbr-temporal-pipeline.json`.\n- The native Scheduler sequence is exactly Interactive → Stabilizing → Accumulating 1/2 → Accumulating 2/2 → Sleeping. Dynamic frames record three Draws / fourteen Triangles; accumulating frames record four Draws / fifteen Triangles.\n- The final diagnostic reports one active Canvas Surface before cleanup, Static and Scheduler convergence at exactly 2/2 samples, no pending RAF, and zero active resources after Feature disposal.\n- Phase 4 remains In Development: no public Phase 4 route, visual/performance acceptance package, Owner Acceptance, deployment, merge, or Accepted Tag is claimed.\n\n### Next\n\n- Implement the public Temporal PBR Canvas lifecycle and independent Phase 4 acceptance Playground with observable Scheduler modes, RAF state, Dirty flags, History validity, sample count, Resize, wake/reset, Device Lost recovery, performance/resource reports, and fixed visual evidence.\n'''
              work_log.write_text(work_log.read_text().rstrip() + entry + '\n')

          decisions = Path('docs/execution/DECISIONS.md')
          if '## ED-039 — Give Present sole Canvas Surface ownership in temporal PBR mode' not in decisions.read_text():
              entry = '''\n\n## ED-039 — Give Present sole Canvas Surface ownership in temporal PBR mode\n\n- **Status:** Accepted\n- **Date:** 2026-07-23\n- **Decision:** In temporal PBR mode, the final Present transaction is the sole owner of the Canvas Surface. PBR borrows only `getSurfaceInfo` and `resize`, and writes exclusively to the caller-prepared offscreen MRT frame. The temporal transaction owns Dynamic/Static History and commit/cancel ordering; the accepted direct PBR mode retains its own Surface unchanged.\n- **Candidates:** Let PBR and Present each create a Surface for the same Canvas; make PBR own the Surface and let Present borrow it; make Present own the only Canvas Surface while PBR borrows dimensions and Resize.\n- **Reason:** Two WebGPU contexts/configurations for one Canvas create ambiguous ownership and recovery order. PBR ownership would also couple scene output to display encoding. Present-only ownership keeps linear HDR scene/History resources independent from display output and makes Resize, Device Lost, disposal, and error rollback mechanically testable.\n- **Impact:** Temporal mode creates one Canvas Surface, while PBR owns no Surface Handle. Direct Phase 3 rendering is unchanged. Future WebGL2 temporal support must preserve the same single-output-owner contract even if its HDR attachment formats differ.\n- **ADR required:** No; this refines the existing ADR-005 temporal ownership and ED-036 through ED-038 composition boundaries without changing dependency direction.\n'''
              decisions.write_text(decisions.read_text().rstrip() + entry + '\n')

          status = Path('WORK_STATUS.md')
          text = status.read_text()
          lines = text.splitlines()
          replacements = {
              '- **Current Commit:**': f'- **Current Commit:** `{verified}` (P4-11 Scheduler-driven single-Surface Temporal PBR pipeline verified)',
              '- **Overall Progress:**': '- **Overall Progress:** 4 / 15 phases accepted; Phase 4 checkpoints P4-01 through P4-11 verified; acceptance Playground integration in progress',
              '- **Current Task:**': '- **Current Task:** P4-12 — Public Temporal PBR Canvas lifecycle and Phase 4 acceptance Playground',
              '- **Last Completed Task:**': '- **Last Completed Task:** P4-11 — ordered PBR MRT → Dynamic TAA → optional Static Accumulation → Present transaction with native Scheduler/WebGPU evidence',
              '- **Next Action:**': '- **Next Action:** Add the public Temporal PBR renderer wrapper, independent `/acceptance/phase-04` route, realtime HUD, interaction/reset/recovery controls, fixed visual baseline, and performance/resource acceptance reports',
              '- **CI Status:**': '- **CI Status:** Run 29978597536 / job 89115544133 PASS at verified Head `9e173a8644f5187934b3343d0991741b2c9afca5`; 32/32 pinned Chromium/WebGPU cases PASS',
              '- **Acceptance Status:**': '- **Acceptance Status:** Phase 0–3 Accepted; Phase 4 In Development; P4-11 verified; Phase 4 route and Owner Acceptance pending',
              '- **Last Updated:**': f'- **Last Updated:** {timestamp}',
          }
          result = []
          for line in lines:
              replaced = False
              for prefix, value in replacements.items():
                  if line.startswith(prefix):
                      result.append(value)
                      replaced = True
                      break
              if not replaced:
                  if line.startswith('|    04 |'):
                      result.append('|    04 | In Development | `agent/phase-04-temporal`            | #7  | PASS        | In Development | —                   |')
                  else:
                      result.append(line)
          status.write_text('\n'.join(result) + '\n')
          PY
      - name: Remove one-time recorder and commit
        run: |
          git rm .github/workflows/record-p4-11.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORK_STATUS.md docs/execution/WORK_LOG.md docs/execution/DECISIONS.md
          git commit -m "docs(phase-04): record P4-11 verification"
          git push origin HEAD:agent/phase-04-temporal
