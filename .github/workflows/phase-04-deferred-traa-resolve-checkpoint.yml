name: Phase 4 Deferred TRAA Resolve Checkpoint

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/phase-04-deferred-traa-resolve-checkpoint.yml]

permissions:
  contents: write

concurrency:
  group: phase-04-deferred-traa-resolve-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase-04-deferred-traa-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Apply independent TRAA Resolve checkpoint
        shell: bash
        env:
          CHECKPOINT_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          exec > >(tee /tmp/phase-04-deferred-traa-resolve-apply.log) 2>&1
          cat .github/phase-04-traa-resolve-payload/part-* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 >/tmp/payload.tar.gz
          tar -xzf /tmp/payload.tar.gz
          python <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          run_id = os.environ['CHECKPOINT_RUN_ID']
          now = datetime.now(ZoneInfo('America/Los_Angeles'))
          stamp = now.strftime('%Y-%m-%d %H:%M PDT')
          log_stamp = now.strftime('%Y-%m-%d %H:%M PDT')

          index_path = Path('packages/renderer/src/index.ts')
          source = index_path.read_text()
          needle = """export {
            DeferredTraaHistory,
            type DeferredTraaHistoryDiagnostics,
            type DeferredTraaHistoryFrame,
            type DeferredTraaHistoryOptions,
            type DeferredTraaHistoryPrepareInput,
            type DeferredTraaHistoryResetReason,
            type DeferredTraaHistorySize,
            type DeferredTraaResolvedFrame,
          } from './deferred-traa-history.js';
          """
          insert = needle + """export {
            DEFERRED_TRAA_DEFAULT_SETTINGS,
            DEFERRED_TRAA_RESOLVE_UNIFORM_LAYOUT,
            DeferredTraaResolvePass,
            createDeferredTraaResolveSettings,
            packDeferredTraaResolveUniforms,
            type DeferredTraaResolveExecutionResult,
            type DeferredTraaResolvePassDiagnostics,
            type DeferredTraaResolvePassInput,
            type DeferredTraaResolvePassOptions,
            type DeferredTraaResolveSettings,
          } from './deferred-traa-resolve-pass.js';
          """
          if source.count(needle) != 1:
              raise SystemExit('Renderer index TRAA History boundary changed.')
          index_path.write_text(source.replace(needle, insert))

          validator = Path('tools/shader-build/validate-shaders.mjs')
          source = validator.read_text()
          needle = "  [\n    'webgpu/phase-04-pbr-temporal-output.wgsl',"
          insert = """  [
            'webgpu/phase-04-deferred-traa-resolve.wgsl',
            {
              exportName: 'PHASE_04_DEFERRED_TRAA_RESOLVE_WGSL',
              path: 'packages/renderer/src/generated/phase-04-deferred-traa-resolve.wgsl.ts',
            },
          ],
          """ + needle
          if source.count(needle) != 1:
              raise SystemExit('Shader mirror temporal-output boundary changed.')
          validator.write_text(source.replace(needle, insert))

          status = Path('WORK_STATUS.md')
          source = status.read_text()
          replacements = {
            '- **Next Action:** Implement the independent TRAA Resolve using current Deferred Lighting color, GBuffer Velocity/Depth, and the verified independent History owner; then connect Post Process and Present for local visual comparison':
              '- **Next Action:** Connect independent Post Process and Present after the verified TRAA Resolve, then expose a local legacy-versus-Deferred comparison for stationary, orbit, thin-edge, and disocclusion visual review',
            '- **CI Status:** Scheduler PASS — Run `30149668021`; GBuffer ownership PASS — Run `30150141951`; Deferred Lighting PASS — Run `30151328444`; independent TRAA History PASS — Run `30151722000`; GBuffer raster and Lighting integration PASS — Run `30158519929`, job `89679879092`, Artifact `8619635406`, digest `sha256:45036b5e1e99ea9e1e051bda9b9cbc923c40499e051b4333c4ed1ae272a53e2a`; trusted standard PR CI pending':
              f'- **CI Status:** Scheduler PASS — Run `30149668021`; GBuffer ownership PASS — Run `30150141951`; Deferred Lighting PASS — Run `30151328444`; independent TRAA History PASS — Run `30151722000`; GBuffer raster PASS — Run `30158519929`, trusted PR Run `30158791712`; independent TRAA Resolve PASS — Run `{run_id}`',
            '- **Known Blockers:** The legacy forward temporal architecture remains visually unstable and must not return to Accepted status; the independent Deferred/TRAA path still requires TRAA Resolve, Post Process/Present integration, local visual review, CI, Pages, and owner acceptance':
              '- **Known Blockers:** The legacy forward temporal architecture remains visually unstable and must not return to Accepted status; the independent Deferred/TRAA path still requires Post Process/Present integration, local visual review, CI, Pages, and owner acceptance',
            '- **Last Updated:** 2026-07-25 05:55 PDT': f'- **Last Updated:** {stamp}',
            '|    04 | Acceptance Reopened | `agent/phase-04-deferred-traa-rebuild` | #34 | RASTER CHECKPOINT PASS | Re-verification | `phase-04-accepted` |':
              '|    04 | Acceptance Reopened | `agent/phase-04-deferred-traa-rebuild` | #34 | RESOLVE CHECKPOINT PASS | Re-verification | `phase-04-accepted` |',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'WORK_STATUS Resolve boundary changed: {old}')
              source = source.replace(old, new)
          status.write_text(source)

          tasks = Path('docs/execution/PHASE_04_TASKS.md')
          source = tasks.read_text()
          needle = """- Complete `pnpm verify` passed in Run `30158519929`; the uploaded
            `phase-04-deferred-gbuffer-raster-verify` Artifact preserves the full gate log.

          ### P4-14 visual-baseline isolation
          """
          section = f"""- Complete `pnpm verify` passed in Run `30158519929`, job `89679879092`; Artifact
            `8619635406`, digest `sha256:45036b5e1e99ea9e1e051bda9b9cbc923c40499e051b4333c4ed1ae272a53e2a`,
            preserves the full gate log. Trusted standard PR Run `30158791712`, job `89680564561`, also passed.

          ### P4-15 independent TRAA Resolve checkpoint

          - Added an independent full-screen TRAA Resolve that samples current Deferred Lighting Color, current
            GBuffer Velocity/Depth, and the caller-prepared independent Color/Depth History frame.
          - Rigid-object Velocity remains unjittered; the Resolve applies the current/previous Jitter delta exactly
            once, validates History with previous raster Depth reprojection, and writes current Depth with resolved HDR.
          - Added closest-depth edge Velocity selection, 3×3 AABB plus variance clipping, motion/subpixel History
            reduction, responsive weighting, minimum current contribution, and luminance flicker reduction.
          - The pass owns only one Shader, Pipeline, Uniform Buffer, and bounded role Bind Groups. It does not commit,
            cancel, resize, present, or import legacy Dynamic TAA and Static Accumulation ownership.
          - Complete `pnpm verify` passed in Run `{run_id}`; the uploaded
            `phase-04-deferred-traa-resolve-verify` Artifact preserves the full gate log.

          ### P4-14 visual-baseline isolation
          """
          if source.count(needle) != 1:
              raise SystemExit('PHASE_04_TASKS Raster boundary changed.')
          tasks.write_text(source.replace(needle, section))

          work_log = Path('docs/execution/WORK_LOG.md')
          with work_log.open('a') as stream:
              stream.write(f"""

          ## {log_stamp} — P4-15 independent TRAA Resolve

          ### Completed

          - Added the independent full-screen TRAA Resolve Shader, runtime mirror, Pipeline, Uniform contract, and bounded Bind Group cache.
          - Consumed current Deferred Lighting Color, current GBuffer Velocity/Depth, and caller-prepared independent History only.
          - Applied current/previous Jitter compensation exactly once to unjittered rigid-object Velocity.
          - Added previous raster Depth reprojection, edge Velocity selection, neighborhood/variance clipping, motion and responsive weighting, minimum current contribution, and HDR flicker reduction.
          - Wrote current Depth beside resolved linear-HDR Color while leaving History commit/cancel entirely caller-owned.
          - Preserved the legacy Forward temporal comparison implementation and immutable Phase 4 accepted tag unchanged.

          ### Validation

          - Raster trusted standard Phase verification: PASS — Run `30158791712`, job `89680564561`.
          - Independent TRAA Resolve complete `pnpm verify`: PASS — Run `{run_id}`.
          - Artifact `phase-04-deferred-traa-resolve-verify` preserves the complete apply and verification output.
          - The checkpoint is committed only after formatting, strict typecheck, unit and lifecycle tests, architecture and Shader mirror checks, builds, budgets, and all pinned Chromium/WebGPU gates pass.

          ### Next

          - Connect independent Post Process and Present after the resolved History output.
          - Expose a local legacy-versus-Deferred comparison and perform stationary, slow/fast orbit, thin-edge, disocclusion, resize, wake/sleep, and resource-stability review.
          """)

          payload_directory = Path('.github/phase-04-traa-resolve-payload')
          for payload_part in payload_directory.glob('part-*'):
              payload_part.unlink()
          payload_directory.rmdir()
          Path('.github/workflows/phase-04-deferred-traa-resolve-checkpoint.yml').unlink()
          PY
      - name: Format exact checkpoint scope
        run: >-
          pnpm exec prettier --write
          WORK_STATUS.md
          docs/execution/PHASE_04_TASKS.md
          docs/execution/WORK_LOG.md
          packages/renderer/src/deferred-traa-resolve-pass.ts
          packages/renderer/src/generated/phase-04-deferred-traa-resolve.wgsl.ts
          packages/renderer/src/index.ts
          packages/renderer/test/deferred-traa-resolve-pass.test.ts
          tools/shader-build/validate-shaders.mjs
      - name: Verify complete repository
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee /tmp/phase-04-deferred-traa-resolve-verify.log
      - name: Preserve verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-04-deferred-traa-resolve-verify
          path: |
            /tmp/phase-04-deferred-traa-resolve-apply.log
            /tmp/phase-04-deferred-traa-resolve-verify.log
          if-no-files-found: warn
      - name: Publish verified checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(phase-04): add independent TRAA Resolve'
          git push origin HEAD:agent/phase-04-deferred-traa-rebuild
