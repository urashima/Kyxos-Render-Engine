name: Phase 4 resource stability final evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-resource-stability-final-evidence.yml

concurrency:
  group: phase-04-resource-stability-final-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: read
  issues: write
  pull-requests: write

jobs:
  verify-final-public-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: true
      DEPLOYED_SHA: 5faf7a8bcf643954dc42e3442f33690efd608a66
      EXPECTED_COMMIT_SHA: 5faf7a8bcf643954dc42e3442f33690efd608a66
      PAGES_LATEST_PHASE: "4"
      PAGES_PHASES: 0,1,2,3,4
      PUBLIC_PLAYGROUND_URL: https://urashima.github.io/Kyxos-Render-Engine/
    steps:
      - name: Check out final evidence branch
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve exact main CI and Pages evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() {
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}$1"
          }
          wait_for_run() {
            local name="$1"
            local event="$2"
            for _ in $(seq 1 180); do
              run="$(api "/actions/runs?head_sha=${DEPLOYED_SHA}&per_page=100" | jq -c --arg name "$name" --arg event "$event" --arg sha "$DEPLOYED_SHA" '[.workflow_runs[] | select(.name == $name and .event == $event and .head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty')"
              if [ -n "$run" ]; then
                status="$(printf '%s' "$run" | jq -r '.status')"
                conclusion="$(printf '%s' "$run" | jq -r '.conclusion // "pending"')"
                id="$(printf '%s' "$run" | jq -r '.id')"
                echo "$name run $id: $status / $conclusion" >&2
                if [ "$status" = completed ]; then
                  test "$conclusion" = success
                  printf '%s' "$id"
                  return 0
                fi
              fi
              sleep 10
            done
            return 1
          }

          main_ci_run="$(wait_for_run 'Phase verification' 'push')"
          pages_run="$(wait_for_run 'Deploy accepted Playgrounds' 'workflow_run')"
          jobs="$(api "/actions/runs/${pages_run}/jobs?per_page=100")"
          build_job="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "Build accepted phase history" and .conclusion == "success")][0].id // empty')"
          deploy_job="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "Deploy public Playground" and .conclusion == "success")][0].id // empty')"
          public_job="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "Verify public interactions" and .conclusion == "success")][0].id // empty')"
          test -n "$build_job"
          test -n "$deploy_job"
          test -n "$public_job"

          deployment="$(api "/deployments?sha=${DEPLOYED_SHA}&environment=github-pages&per_page=20" | jq -r '.[0].id // empty')"
          test -n "$deployment"

          {
            echo "MAIN_CI_RUN=${main_ci_run}"
            echo "PAGES_RUN=${pages_run}"
            echo "PAGES_BUILD_JOB=${build_job}"
            echo "PAGES_DEPLOY_JOB=${deploy_job}"
            echo "PAGES_PUBLIC_JOB=${public_job}"
            echo "PAGES_DEPLOYMENT=${deployment}"
          } >> "$GITHUB_ENV"

          jq -n \
            --arg deployedSha "$DEPLOYED_SHA" \
            --arg mainCiRun "$main_ci_run" \
            --arg pagesRun "$pages_run" \
            --arg pagesBuildJob "$build_job" \
            --arg pagesDeployJob "$deploy_job" \
            --arg pagesPublicJob "$public_job" \
            --arg pagesDeployment "$deployment" \
            --arg finalEvidenceRun "$GITHUB_RUN_ID" \
            '{deployedSha:$deployedSha,mainCiRun:$mainCiRun,pagesRun:$pagesRun,pagesBuildJob:$pagesBuildJob,pagesDeployJob:$pagesDeployJob,pagesPublicJob:$pagesPublicJob,pagesDeployment:$pagesDeployment,finalEvidenceRun:$finalEvidenceRun}' \
            > /tmp/phase-04-final-evidence.json

      - name: Re-run official public Chromium and WebGPU acceptance
        run: pnpm exec playwright test --config playwright.pages.config.ts --reporter=list

      - name: Run complete final governance verification
        run: pnpm verify

      - name: Publish exact evidence to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          evidence="$(cat /tmp/phase-04-final-evidence.json)"
          body="$(cat <<EOF
          <!-- phase-04-resource-stability-final-evidence -->
          Phase 4 final public resource-stability verification passed.

          \`\`\`json
          ${evidence}
          \`\`\`

          The run independently passed the official public Chromium/WebGPU suite for Phase 0–4 and \`/latest/\`, including repeated Jitter → Default resets, and then passed complete \`pnpm verify\`.
          EOF
          )"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-resource-stability-final-evidence
          path: |
            /tmp/phase-04-final-evidence.json
            test-results/pages
            test-results/phase-04
          if-no-files-found: ignore
