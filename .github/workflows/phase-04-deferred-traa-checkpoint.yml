name: Phase 4 deferred TRAA checkpoint

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-deferred-traa-checkpoint.yml
  push:
    branches:
      - agent/phase-04-deferred-traa-rebuild
    paths:
      - .github/workflows/phase-04-deferred-traa-checkpoint.yml

permissions:
  contents: write

jobs:
  verify-and-record:
    name: Verify and record scheduler checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase-04-deferred-traa-rebuild

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Append canonical work log
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/execution/WORK_LOG.md')
          marker = '## 2026-07-25 10:05 PDT — P4-15 independent Deferred TRAA scheduling boundary'
          entry = '''## 2026-07-25 10:05 PDT — P4-15 independent Deferred TRAA scheduling boundary

          ### Completed

          - Reproduced the public Dynamic TAA shaking on the local Phase 4 Playground and reopened owner visual acceptance without moving the immutable `phase-04-accepted` tag.
          - Accepted ADR-006: the legacy forward temporal transaction remains a comparison path, while the replacement uses independent `GBuffer → Deferred Lighting → TRAA Resolve → Post Process → Present` ownership.
          - Added `DeferredTraaFrameScheduler` with only Interactive, bounded Resolving, and Sleeping modes; it imports neither the legacy Temporal Scheduler transaction nor Static Accumulation.
          - Added explicit History actions (`reset`, `advance`, `reuse`), coalesced generation resets, a fixed pass order, bounded resolve tails, and stable Jitter reuse for Selection/Post-only frames.
          - Added regression coverage for pass order, dirty-batch coalescing, non-History reuse, resolve interruption/restart, suspension, and disposal.

          ### Validation

          - Local owner observation: the legacy Dynamic TAA path visibly shakes under the current Phase 4 route.
          - Complete `pnpm verify` passed in the repository-owned checkpoint workflow before publishing the canonical checkpoint commit.
          - No legacy TAA Shader, History resource, Static Accumulation implementation, accepted visual baseline, or public Phase 4 default was modified in this checkpoint.

          ### Next

          - Implement the independently owned GBuffer target set and Deferred Lighting pass behind the new scheduler contract.
          - Add new TRAA Color/Depth History and Resolve ownership, switch the local comparison route, and perform stationary/orbit/disocclusion visual review before public deployment.
          '''
          source = path.read_text(encoding='utf-8')
          if marker not in source:
              path.write_text(source.rstrip() + '\n\n' + entry.strip() + '\n', encoding='utf-8')
          PY

      - name: Format checkpoint files
        run: |
          pnpm exec prettier --write \
            packages/frame-scheduler/src/deferred-traa-scheduler.ts \
            packages/frame-scheduler/src/index.ts \
            packages/frame-scheduler/test/deferred-traa-scheduler.test.ts \
            docs/adr/ADR-006-independent-deferred-traa-pipeline.md \
            tools/quality/check-architecture-docs.mjs \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md \
            docs/execution/WORK_LOG.md \
            .github/workflows/phase-04-deferred-traa-checkpoint.yml

      - name: Run complete verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/phase-04/runtime
          pnpm verify 2>&1 | tee test-results/phase-04/runtime/deferred-traa-checkpoint.log

      - name: Commit verified checkpoint
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/frame-scheduler/src/deferred-traa-scheduler.ts \
            packages/frame-scheduler/src/index.ts \
            packages/frame-scheduler/test/deferred-traa-scheduler.test.ts \
            docs/adr/ADR-006-independent-deferred-traa-pipeline.md \
            tools/quality/check-architecture-docs.mjs \
            WORK_STATUS.md \
            docs/execution/PHASE_04_TASKS.md \
            docs/execution/WORK_LOG.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(phase-04): establish deferred TRAA scheduling boundary"
          git push origin HEAD:agent/phase-04-deferred-traa-rebuild

      - name: Upload verification log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: deferred-traa-checkpoint-${{ github.run_attempt }}
          path: test-results/phase-04/runtime/deferred-traa-checkpoint.log
          if-no-files-found: ignore
          retention-days: 7
