name: Phase 4 repair failure snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase-04-repair-failure-snapshot.yml

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Capture repair failure log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 30140847146 --repo "${GITHUB_REPOSITORY}" --log-failed > /tmp/repair-failure.log
          tail -n 240 /tmp/repair-failure.log

      - name: Upload repair failure log
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-repair-failure-log
          path: /tmp/repair-failure.log
