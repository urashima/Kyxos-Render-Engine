name: Pages online diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pages-online-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture Phase 4 resource transitions
        run: |
          cat > phase-04-resource-diagnostic.mjs <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';

          const url = 'https://urashima.github.io/Kyxos-Render-Engine/phase-4/';
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--enable-unsafe-webgpu',
              '--enable-features=Vulkan,UseSkiaRenderer',
              '--use-angle=swiftshader',
              '--disable-vulkan-surface',
            ],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });

          const text = async (id) => (await page.getByTestId(id).textContent())?.trim() ?? '';
          const waitForSleeping = async () => {
            await page.getByTestId('renderer-state').waitFor({ timeout: 60_000 });
            await page.waitForFunction(() => {
              const value = (id) => document.querySelector(`[data-testid="${id}"]`)?.textContent?.trim();
              return (
                value('renderer-state') === 'ready' &&
                value('render-mode') === 'sleeping' &&
                value('sample-count') === '16' &&
                value('raf-active') === 'false' &&
                value('history-valid') === 'valid'
              );
            }, undefined, { timeout: 60_000 });
          };
          const snapshot = async (label) => ({
            label,
            resourceCount: Number(await text('resource-count')),
            resourceBaseline: await text('resource-baseline'),
            resourceVerdict: await text('resource-verdict'),
            pipelineCount: Number(await text('pipeline-count')),
            textureBytes: await text('texture-bytes'),
            bufferBytes: await text('buffer-bytes'),
            historyGeneration: Number(await text('history-generation')),
            wakeCount: Number(await text('wake-count')),
            jitter: await text('taa-current-jitter'),
          });

          const evidence = [];
          try {
            await page.goto(`${url}?resource-diagnostic=${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 120_000,
            });
            await waitForSleeping();
            evidence.push(await snapshot('initial'));

            await page.locator('[data-taa-control="jitterScale"][type="number"]').fill('0.35');
            await waitForSleeping();
            evidence.push(await snapshot('jitter-0.35'));

            await page.getByRole('button', { name: 'Default TAA' }).click();
            await waitForSleeping();
            evidence.push(await snapshot('default-1'));

            await page.locator('[data-taa-control="jitterScale"][type="number"]').fill('0.45');
            await waitForSleeping();
            evidence.push(await snapshot('jitter-0.45'));

            await page.getByRole('button', { name: 'Default TAA' }).click();
            await waitForSleeping();
            evidence.push(await snapshot('default-2'));
          } finally {
            await browser.close();
          }

          console.log(JSON.stringify(evidence, null, 2));
          await writeFile('/tmp/phase-04-resource-diagnostic.json', `${JSON.stringify(evidence, null, 2)}\n`);
          JS
          node phase-04-resource-diagnostic.mjs
          rm phase-04-resource-diagnostic.mjs

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-resource-diagnostic
          path: /tmp/phase-04-resource-diagnostic.json
          if-no-files-found: error
