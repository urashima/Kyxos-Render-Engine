name: Pages online diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pages-online-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture Phase 4 resource transitions
        run: |
          cat > phase-04-resource-diagnostic.mjs <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';

          const output = '/tmp/phase-04-resource-diagnostic.json';
          const result = { error: null, snapshots: [] };
          const persist = async () => {
            await writeFile(output, `${JSON.stringify(result, null, 2)}\n`);
            console.log(JSON.stringify(result, null, 2));
          };
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--disable-vulkan-surface',
              '--enable-features=Vulkan',
              '--enable-unsafe-swiftshader',
              '--enable-unsafe-webgpu',
              '--use-angle=swiftshader',
              '--use-gpu-in-tests',
              '--use-vulkan=swiftshader',
              '--use-webgpu-adapter=swiftshader',
            ],
          });
          const page = await browser.newPage({
            colorScheme: 'dark',
            viewport: { width: 1280, height: 720 },
          });
          const text = async (id) => (await page.getByTestId(id).textContent())?.trim() ?? '';
          const waitForSleeping = async () => {
            await page.waitForFunction(() => {
              const value = (id) => document.querySelector(`[data-testid="${id}"]`)?.textContent?.trim();
              return (
                value('renderer-state') === 'ready' &&
                value('render-mode') === 'sleeping' &&
                value('sample-count') === '16' &&
                value('raf-active') === 'false' &&
                value('history-valid') === 'valid'
              );
            }, undefined, { timeout: 60_000 });
          };
          const snapshot = async (label) => ({
            label,
            resourceCount: Number(await text('resource-count')),
            resourceBaseline: await text('resource-baseline'),
            resourceVerdict: await text('resource-verdict'),
            pipelineCount: Number(await text('pipeline-count')),
            textureBytes: await text('texture-bytes'),
            bufferBytes: await text('buffer-bytes'),
            historyGeneration: Number(await text('history-generation')),
            wakeCount: Number(await text('wake-count')),
            jitter: await text('taa-current-jitter'),
          });
          const record = async (label) => {
            result.snapshots.push(await snapshot(label));
            await persist();
          };

          try {
            await page.goto(
              `https://urashima.github.io/Kyxos-Render-Engine/phase-4/?resource-diagnostic=${Date.now()}`,
              { waitUntil: 'domcontentloaded', timeout: 120_000 },
            );
            await waitForSleeping();
            await record('initial');

            await page.locator('[data-taa-control="jitterScale"][type="number"]').fill('0.35');
            await waitForSleeping();
            await record('jitter-0.35');

            await page.getByRole('button', { name: 'Default TAA' }).click();
            await waitForSleeping();
            await record('default');
          } catch (error) {
            result.error = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
            await persist();
          } finally {
            await browser.close();
          }
          JS
          node phase-04-resource-diagnostic.mjs
          rm phase-04-resource-diagnostic.mjs

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-resource-diagnostic
          path: /tmp/phase-04-resource-diagnostic.json
          if-no-files-found: error
